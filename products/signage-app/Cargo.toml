[package]
name = "lait-signage-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Client protocol and frame renderer for the Signage World"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
anyhow = "1"
font8x8 = "0.3.1"
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = "0.2.35"
mechanics = { path = "../../crates/mechanics" }
replica = { path = "../../crates/replica" }
# The container reader: media_ingest derives a catalog before sealing.
mediabox = { path = "../../crates/mediabox" }
runtime = { path = "../../crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signage = { package = "lait-signage", path = "../signage" }
world-interface = { path = "../../crates/world-interface" }
world-sdk = { path = "../../crates/world-sdk" }

[lints]
workspace = true

[dev-dependencies]
mediabox = { path = "../../crates/mediabox", features = ["testkit"] }
