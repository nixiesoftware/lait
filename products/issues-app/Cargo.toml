[package]
name = "lait-issues-app"
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
description = "Client interfaces and application protocol for LAIT's bundled Issues World"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
issues = { package = "lait-issues", path = "../issues" }
mechanics = { path = "../../crates/mechanics" }
replica = { path = "../../crates/replica" }
runtime = { path = "../../crates/runtime" }
world-bridge = { path = "../../crates/world-bridge" }
world-interface = { path = "../../crates/world-interface" }

clap = "4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
anyhow = "1"
data-encoding = "2.6"
