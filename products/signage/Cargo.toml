[package]
name = "lait-signage"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Durable signage program World for Astrolabe Display"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
blake3 = "1"
mechanics = { path = "../../crates/mechanics" }
replica = { path = "../../crates/replica" }
runtime = { path = "../../crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
