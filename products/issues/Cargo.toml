[package]
name = "lait-issues"
version = "0.7.8"
edition = "2021"
rust-version = "1.92"
description = "LAIT's canonical IssuesWorld product: schemas, semantic model, DTOs, and product identifiers"
license = "PolyForm-Noncommercial-1.0.0"
# See the root manifest: noncommercial terms and crates.io do not mix.
publish = false

[lints]
workspace = true

[dependencies]
mechanics = { path = "../../crates/mechanics" }
replica = { path = "../../crates/replica" }
fabric = { path = "../../crates/fabric" }
runtime = { path = "../../crates/runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
postcard = { version = "1", features = ["use-std"] }
data-encoding = "2.6"
blake3 = "1"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
