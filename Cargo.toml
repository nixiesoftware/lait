[workspace]
members = [
    "crates/journal",
    "crates/mechanics",
    "crates/fabric",
    "crates/addressbook",
    "crates/comms",
    "crates/relay",
    "crates/replica",
    "crates/runtime",
    "crates/world-interface",
    "products/issues",
    "products/issues-app",
    "tools/workbench",
    "tools/astrolabe",
]
# Two packages live in this repository but are NOT members, each because it
# needs a build setting the rest of the workspace must never see.
#
# `fuzz/` needs a nightly toolchain for cargo-fuzz's `-Z` sanitizer flags, and
# this workspace pins `channel = "stable"` with an MSRV floor CI checks.
#
# `sim/` needs `--cfg getrandom_backend="custom"`, which replaces the operating
# system's entropy with a seeded generator across the whole dependency graph.
# That is exactly right for a deterministic simulation and catastrophic in a
# release binary, so it is set in `sim/.cargo/config.toml` — cargo reads config
# upward from the current directory and never downward, so a build at this root
# cannot see it.
#
# Excluding both means `cargo build`, `cargo test`, `cargo clippy` and the MSRV
# job never encounter either.
exclude = ["fuzz", "sim"]
# Pin resolver 2 explicitly: the release binary's non-linkage of the dev-only
# `test-utils` feature (which would flip presets::N0 from prod to staging relays)
# depends on it, and must not silently regress to v1 if this ever becomes a
# virtual workspace.
resolver = "2"

[package]
name = "lait"
version = "0.7.11"
edition = "2021"
# MSRV: driven by typst 0.15.1 (via products/issues-app), which requires rustc
# 1.92. iroh 1.0.0-rc.1 held the floor at 1.91 before that; it is no longer the
# binding constraint. The whole workspace carries the same figure because the
# gate checks the whole workspace — a lower number on a library crate would be
# a claim nothing verifies.
rust-version = "1.92"
description = "A local-first, peer-to-peer, end-to-end-encrypted issue tracker built on iroh + Loro CRDTs"
authors = ["onnixi <omar@onnixi.com>"]
license = "MIT OR Apache-2.0"
# GitHub is the canonical home: source of record, release host, and issue tracker.
repository = "https://github.com/nixiesoftware/lait"
homepage = "https://github.com/nixiesoftware/lait"
readme = "README.md"
keywords = ["iroh", "p2p", "gossip", "crdt", "issue-tracker"]
categories = ["command-line-utilities", "network-programming"]
# Keep the published crate lean: ship the crate sources, docs, and licenses;
# drop the web viewer, packaging scaffolding, CI, and editor/agent tooling that
# only matter in the repo. (`target/` and `.git/` are always excluded by cargo.)
exclude = [
    "viewer/",
    "packaging/",
    "ci/",
    "hooks/",
    "skills/",
    "tools/",
    ".github/",
    ".githooks/",
    ".claude/",
    ".claude-plugin/",
    "dist-workspace.toml",
    "Dockerfile",
    "docker-compose.yml",
    ".dockerignore",
]

# `cargo binstall lait` — fetch the prebuilt cargo-dist release archive from
# GitHub instead of compiling. The URL/layout below matches what cargo-dist
# **actually** publishes (verified against the released v0.4.8 assets), which is
# per-OS, NOT flat everywhere: the unix `.tar.gz` archives nest the binary under
# a `lait-<target-triple>/` directory, while the Windows `.zip` is flat with
# `lait.exe` at the archive root. `bin-dir` must reflect that per-OS shape — the
# same layout the self-updater encodes in `update_bin_path_in_archive` (app.rs).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
# Windows `.zip` is flat: `lait.exe` at the root, no nesting directory.
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "lait"
path = "src/lib.rs"

[[bin]]
name = "lait"
path = "src/main.rs"

[dependencies]
# lait's roots — identity, trust regimes, derivation rules. Depends on no
# scaffold; re-exported at this crate's root so the app layer reaches it by its
# historical paths (`crate::acl`, `lait::ids`, …).
mechanics = { path = "crates/mechanics" }
# The fabric — the shared world; Loro sealed behind typed wrappers. The app
# depends on this, not on Loro: `loro` is intentionally absent from THIS
# manifest, so `loro::*` cannot be named in the app layer. The seal is the
# dependency edge.
fabric = { path = "crates/fabric" }
# The orbital runtime + Replica semantics. The product adopts the orbital
# lifecycle through these — hosting a World, docking Sessions, and committing
# through the Replica/Fabric path — the same public API any consumer uses. This
# is the S5c adoption edge: the root application depends on the new crates.
runtime = { path = "crates/runtime" }
replica = { path = "crates/replica" }
world-interface = { path = "crates/world-interface" }
# The network adapter — how independently held replicas exchange their material.
# `iroh` is intentionally absent from THIS manifest: the app composes the seam
# (`Transport`, framed `Stream`s, gossip rooms) and never names the contractor
# behind it. Swapping the adapter is a manifest change, not a daemon rewrite.
comms = { path = "crates/comms" }
# The canonical bundled product. Its semantic World, schemas, DTOs, and ids are
# independently packaged; this root owns only the application shell and local
# control adapters that compose it into Daemon.
issues = { package = "lait-issues", path = "products/issues" }
issues-app = { package = "lait-issues-app", path = "products/issues-app" }
# randomness for ULID minting (app-minted DocId/ProjectId/… ids).
getrandom = "0.3"

# E2EE (P3) is the KERNEL's job now: ed25519 signing, X25519 sealed boxes, and
# the ChaCha20-Poly1305 envelope all live in `mechanics::crypto`, which is the
# only crate that names those primitives. The app deliberately lists NONE of
# them, so reaching around the kernel to hand-roll a key derivation does not
# compile — the same manifest-edge enforcement that seals Loro into fabric.
# (`ed25519-dalek` remains a dev-dependency: interop tests forge raw keys.)
# async runtime + streams
tokio = { version = "1", features = ["full"] }
n0-future = "0.3"

# serialization: serde_json for state/control protocol, postcard for wire messages
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
serde-byte-array = "0.1"
bytes = "1"
data-encoding = "2.6"
blake3 = "1"

# cross-platform local IPC for the daemon control channel: a Unix-domain socket
# on unix, a named pipe on Windows — same API, so the daemon and its heads are portable.
interprocess = { version = "2", features = ["tokio"] }
# cross-platform advisory file lock for the single-instance daemon guard
# (replaces the unix-only flock(2)).
fs2 = "0.4"

# misc
anyhow = "1"
async-trait = "0.1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The local app's HTTP surface (docs/SERVE.md), which bare `lait` launches. axum
# is a thin router over hyper + tower + http, all three already in the tree
# transitively (iroh, self_update), so the adapter buys routing and SSE not a new
# stack. `tokio-stream`'s `sync` feature is the `broadcast::Receiver` -> `Stream`
# multiplex the doorbell stream needs.
# `ws` is on for the browser socket (`src/serve/socket.rs`). It pulls
# tokio-tungstenite; nothing else in the tree does, so the feature is genuinely
# additive rather than unified in from another crate. `http2` stays off — it buys
# nothing without TLS, and this surface is loopback plaintext by design.
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# The web client, compiled into the binary. `include_dir` reads `src/serve/assets`
# at compile time, which is why the built bundle is COMMITTED and lives under
# `src/` rather than in the excluded `viewer/`: `cargo install lait` must not need
# npm (same reproducibility bar `build.rs` holds by never shelling out to git),
# and the published crate drops `viewer/` entirely. See `docs/UI.md`.
include_dir = "0.7"

# mcp server (stdio)
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
# Already in the tree via rmcp (which `mcp.rs` derives against). Declared directly
# so `control::Request` can describe its own shape, which is what lets
# `tests/viewer_parity.rs` check the hand-written TS mirror against it instead of
# trusting it. Same "generate/check, don't hand-maintain twice" rule as
# `mcp_parity.rs`.
schemars = "1"
# The self-updater behind `Request::HostUpdate` (`src/update.rs`): a
# GitHub-release fetch + atomic self-replace. `ureq` backend + `rustls` keeps it
# pure-Rust (no reqwest/native-tls/OpenSSL C dep); gzip/zip extraction only (no
# xz), matching the `.tar.gz` release archives.
self_update = { version = "0.44.0", default-features = false, features = ["ureq", "rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }

# windows-only: keep our handles ours. `CreateProcess` inherits all-or-nothing,
# so the daemon we spawn would otherwise come up holding a captured caller's
# stdout pipe and never let it see EOF. Needs `SetHandleInformation` (clear the
# inherit flag on our own stdio — `process::disinherit_stdio`) and
# `CreateProcessW` + `PROC_THREAD_ATTRIBUTE_HANDLE_LIST` (inherit exactly the
# three handles we name — `daemon_spawn`), which std only exposes as an unstable
# feature. Already present transitively (iroh/tokio); declared directly for those.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # `secretfs`: secrets are created with an explicit owner-only DACL rather
    # than inheriting the parent's. std gives us no way to do that — there is no
    # `DirBuilderExt` on Windows, and `OpenOptionsExt` exposes only CreateFileW's
    # access/share/flags bits (`lpSecurityAttributes` is hardcoded null) — so the
    # secret paths call CreateFileW/CreateDirectoryW directly.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    # Peak working set, for the plan-13 F0 commit-cost baseline. The existing
    # perf gate reports RSS on Linux only; a write-cost measurement that is
    # blank on the platform lait is developed on is not a measurement.
    "Win32_System_ProcessStatus",
    # DPAPI wrap for device-bound secrets (never for portable recovery keys).
    "Win32_Security_Cryptography",
] }

# apple-only, tests: the plan-13 commit-cost baseline reads peak RSS, and Darwin
# is the one target with no other route to it — Linux reads /proc and Windows
# calls GetProcessMemoryInfo. `libc` was a direct dependency until the CLI's
# SIGPIPE reset went with the command surface; this is what still needs it, and
# it needs it only here. Neither a Windows nor a Linux build compiles the arm
# that uses it, so nothing but the macOS job can catch its absence.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
libc = "0.2"

# Signals, at both ends of the process. std resets **only** SIGPIPE across
# spawn/exec — it deliberately preserves the signal mask and every other
# `SIG_IGN` — so a daemon inherits whatever its launch chain was carrying: a
# shell's background-job `SIG_IGN` for SIGINT/SIGQUIT, or a blocked SIGTERM from
# any ancestor that masked one. A daemon that inherits a blocked SIGTERM cannot
# be stopped by SIGTERM at all, which is indistinguishable from a hang. And at
# the other end, tokio never unregisters a signal handler, so a daemon past its
# shutdown has an installed-but-dead SIGTERM handler that swallows the signal
# instead of terminating. `process::reset_signal_environment` and
# `process::restore_default_termination_signals` fix those two ends, and neither
# is expressible through std.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mechanics = { path = "crates/mechanics", features = ["fault-injection"] }
replica = { path = "crates/replica", features = ["fault-injection"] }
issues-app = { package = "lait-issues-app", path = "products/issues-app", features = ["fault-injection"] }
# A zero-wiring test entrypoint: a `#[cfg(test)] #[ctor]` scrubs ambient `LAIT_*`
# env at unit-test process load, *before* any test runs, so a developer's
# inherited `$LAIT_HOME`/`$LAIT_STORE` can never silently redirect store/identity
# resolution mid-test (it broke `config::tests::discovery_never_creates_but_init
# _path_does` exactly this way). Tests that *want* those vars set them explicitly
# afterward (serialized by `ENV_LOCK`). Pulls only syn/quote, already in the tree.
ctor = "0.2"
# The semantic-naming gate parses rather than scanning lines: fields, locals,
# parameters, enum variants, and `impl`-block declarations are all violation
# positions a prefix scan cannot see, and `let v1 = …`/`ipv4` are false
# positives it cannot avoid. `full` + `visit` is what walks a whole file.
syn = { version = "2", features = ["full", "visit", "parsing"] }
# Raw crypto primitives are TEST-ONLY at this layer: `identity_interop.rs` and
# `frost_interop.rs` forge keys and drive ceremony rounds against the kernel's
# public surface, which is exactly the kind of adversarial construction that has
# to reach past `mechanics::crypto`. Production code goes through the kernel.
ed25519-dalek = "2"
frost-ed25519 = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
# `ServiceExt::oneshot` — drive `serve`'s real router in-process, so the gate's
# ordering and precedence are tested through the thing that implements them
# rather than a copy of it. No port, no daemon.
tower = { version = "0.5", features = ["util"] }
# Ground truth for the self-updater's archive layout: the `#[ignore]`d
# `update_bin_path_is_a_real_entry_in_the_published_archives` reads the REAL
# published release archives (CI downloads them; see the `updater-contract` job),
# so the path handed to self_update is checked against the bytes users actually
# download rather than against our own model of cargo-dist's conventions — the
# model is what was wrong in v0.4.8/v0.5.0. All three already build as part of
# `self_update`, so they add no meaningful compile cost.
flate2 = "1"
tar = "0.4"
# `deflate` only — the same codec `self_update`'s `compression-zip-deflate`
# turns on, and all cargo-dist's zip uses. The default feature set drags in
# aes/bzip2/zstd/lzma for codecs no release archive contains.
zip = { version = "6", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
# Tests build with the `test` profile, which inherits `dev` — i.e. unoptimized.
# That is fine for our own code (fast rebuilds, real debug info) but brutal for
# the crypto: curve25519-dalek/frost-ed25519 run 10–50x slower unoptimized, and
# the ceremony tests drive real DKG + threshold-signing rounds. Optimizing only
# *dependencies* keeps workspace compile times and debuggability intact while
# making those tests finish in seconds instead of minutes — the difference
# between fitting nextest's terminate-after budget and being killed by it.
[profile.dev.package."*"]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

# The single definition of the workspace lint policy. Every member inherits it
# with `[lints] workspace = true`; the block used to be copy-pasted into all
# eleven manifests, which made any change to the policy an eleven-file edit and
# is why the policy never changed.
#
# Advisory only, on purpose. `pedantic`/`nursery` are stylistic suggestions, and
# CI runs clippy without `-D warnings` so they cannot fail a build. The lints
# that *do* fail are the crash/error-safety set each crate root denies under
# `not(test)` (see `src/lib.rs`) — promoting these to deny would erase that
# boundary by making style suggestions fatal on test targets too.
#
# `fuzz/` and `sim/` are workspace `exclude`s, not members, so they cannot
# inherit this and carry no lint policy of their own.
[workspace.lints.rust]
# `lait_simulation` is set only by the out-of-workspace `sim/` package, which
# needs Loro's wall-clock timestamp off to be reproducible. Declared so the
# unexpected-cfg lint does not flag it. `sim/.cargo/config.toml` puts the flag
# on RUSTFLAGS, so it reaches every crate in the graph, not just the one that
# reads it — declaring it here rather than in `fabric` alone matches that. Its
# only consumer is still `crates/fabric/src/op.rs`.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(lait_simulation)',
    # Set by `flutter_rust_bridge`'s `#[frb]` macro while it expands the bridge
    # surface. Declared here rather than allowed at each call site: the flag is
    # the generator's, and three local allows would be three copies of one fact.
    'cfg(frb_expand)',
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# The two groups above are enabled wholesale and then curated by name below.
# That is how a lint group is meant to be used: turn it on, decide once which of
# its opinions this codebase does not share, and keep what is left small enough
# that somebody actually reads it.
#
# Uncurated, the groups emitted 3466 warnings — enough that `cargo clippy` was
# useless as a local signal and a genuine finding could not be seen. The 56
# allows below account for 2823 of those (81%), all of them style or convention
# with no defect signal, leaving 643 that are worth looking at. Counts are as of
# this commit and will drift; they are here to show the shape, not to be exact.
#
# What deliberately stays at `warn`, because in this workspace it is not style:
#
#   cast_possible_truncation/precision_loss/sign_loss/lossless  (220)
#     `as_conversions` is denied under `not(test)`, but 64 production modules
#     waive it at module level. In exactly those modules these are the only
#     remaining check on a truncating cast.
#   missing_panics_doc  (81, all in production code)
#     Not a docs nit here. `panic`/`unwrap_used`/`expect_used` are denied under
#     `not(test)`, so each of these marks a *public* function that can still
#     panic inside a waived module — the audit trail for the crash-safety
#     policy, and the list to work off when tightening it.
#   redundant_clone (141), significant_drop_tightening (41), future_not_send (24)
#     Cost and concurrency shape, not taste.
#
# Adding an allow here is a decision about the whole workspace. Prefer a local
# `#[allow(..., reason = "...")]` for a single justified site.

# A std lock guard that is still live at an `.await`. Denied, not warned: the
# drivers run on single-threaded `LocalSet`s with one task per connection, so a
# guard held across a suspension parks the only thread there is and nothing can
# release it — a self-deadlock, not contention. `await_holding_lock` is
# warn-by-default and no workflow here sets `-D warnings`, so at `warn` this
# lint is emitted and ignored; `deny` is what makes clippy exit non-zero.
# Deliberately NOT gated on `not(test)` like the crash-safety set at each crate
# root: `--all-targets` compiles the lib twice and the deny would be off in the
# `cfg(test)` pass, which is where the connection-handling test doubles live.
await_holding_lock = "deny"

# Attribute completeness. This workspace annotates `#[must_use]` and `const`
# where they carry meaning, not everywhere the compiler would tolerate them.
must_use_candidate = "allow"                # 722
missing_const_for_fn = "allow"              # 258
return_self_not_must_use = "allow"          # 22

# Rustdoc section conventions. The docs here are long-form prose that explains
# why a thing exists; they do not use clippy's `# Errors` section format, and
# the first paragraph is a sentence rather than a summary line.
missing_errors_doc = "allow"                # 397
too_long_first_doc_paragraph = "allow"      # 166
doc_markdown = "allow"                      # 136
missing_fields_in_debug = "allow"           # 1

# API shape. These argue against choices made on purpose: `pub(crate)` inside a
# private module is what the sealed-façade layout produces by construction, and
# by-value parameters are frequently how ownership is handed across a seam.
too_many_lines = "allow"                    # 79
needless_pass_by_value = "allow"            # 77
redundant_pub_crate = "allow"               # 24
unused_self = "allow"                       # 7
derive_partial_eq_without_eq = "allow"      # 7
trivially_copy_pass_by_ref = "allow"        # 5
struct_excessive_bools = "allow"            # 3
wrong_self_convention = "allow"             # 3

# Expression and idiom preferences. Rewriting any of these changes how the code
# reads and nothing about what it does.
use_self = "allow"                          # 320
redundant_closure_for_method_calls = "allow" # 124
map_unwrap_or = "allow"                     # 67
option_if_let_else = "allow"                # 56
default_trait_access = "allow"              # 42
items_after_statements = "allow"            # 40
duration_suboptimal_units = "allow"         # 32
ignored_unit_patterns = "allow"             # 31
unreadable_literal = "allow"                # 29
single_match_else = "allow"                 # 24
semicolon_if_nothing_returned = "allow"     # 20
match_same_arms = "allow"                   # 20
unnested_or_patterns = "allow"              # 18
similar_names = "allow"                     # 12
manual_let_else = "allow"                   # 12
explicit_iter_loop = "allow"                # 11
elidable_lifetime_names = "allow"           # 8
bool_assert_comparison = "allow"            # 8
needless_continue = "allow"                 # 6
match_wildcard_for_single_variants = "allow" # 6
range_plus_one = "allow"                    # 3
needless_raw_string_hashes = "allow"        # 3
wildcard_imports = "allow"                  # 2
nonminimal_bool = "allow"                   # 2
needless_lifetimes = "allow"                # 2
if_not_else = "allow"                       # 2
enum_glob_use = "allow"                     # 2
useless_let_if_seq = "allow"                # 1
unnecessary_trailing_comma = "allow"        # 1
uninlined_format_args = "allow"             # 1
string_lit_as_bytes = "allow"               # 1
single_option_map = "allow"                 # 1
ref_option = "allow"                        # 1
option_option = "allow"                     # 1
many_single_char_names = "allow"            # 1
manual_string_new = "allow"                 # 1
manual_assert_eq = "allow"                  # 1
from_iter_instead_of_collect = "allow"      # 1
for_kv_map = "allow"                        # 1
equatable_if_let = "allow"                  # 1
enum_variant_names = "allow"                # 1

[lints]
workspace = true
