# nextest runs test binaries in parallel — the main lever for the multi-node
# integration suite, which `cargo test` ran serially. This config keeps that fast
# path both quick and reliable.

# Bound how many network-heavy tests run at once. The selected integration
# binaries spawn daemons or put real P2P traffic over iroh; nextest otherwise scales
# concurrency to num-cpus, so on a high-core SELF-HOSTED runner it would fire many
# at once — dozens of daemons hammering the relay — trading speed for flakiness.
# Capping at a fixed, core-independent number keeps contention sane. The suite's
# long pole is a single ~8s test, so this barely costs wall-clock; raise it if the
# integration suite grows and the runners can take the load.
[test-groups]
network = { max-threads = 4 }

[profile.default]
# No blanket retry. A retry is a statement that a test has a known, tolerated
# source of nondeterminism — true of the real-network suites, false of
# everything else. Applied globally it costs double time on every deterministic
# failure and, worse, quietly launders a newly flaky unit test into a green run.
# The network group opts in below.
retries = 0

# Surface a wedged test (e.g. a daemon that never bound its control channel)
# instead of hanging the job: warn at 30s, terminate after 3 periods (90s). No
# real test comes close now — the slowest are the ~11s liveness probe and the
# ~7s two-node convergence — so this is a margin, not a tuning knob. A test that
# trips the 30s warning is almost certainly parked on a peer that will never
# answer, which is the condition this is here to surface.
#
# This budget assumes DEPENDENCIES ARE BUILT OPTIMIZED — see
# `[profile.dev.package."*"]` in Cargo.toml. Tests inherit the `dev` profile, and
# with unoptimized curve25519-dalek/frost-ed25519 the ceremony tests (real DKG +
# threshold signing) take ~115s each and get terminated here. If these start
# timing out, check that profile before reaching for a larger budget.
slow-timeout = { period = "30s", terminate-after = 3 }

# Only the suites that put real traffic on a real relay belong in the network
# cap. Listing them by name rather than taking all of `kind(test)` matters: most
# integration binaries here are CPU-bound (argument parsing, DTO parity,
# property-based convergence, threshold crypto) or drive the daemon over an
# in-memory transport, and putting them in a four-slot group made them queue
# behind network tests for no reason. That mis-grouping gets worse with every
# integration binary added, so the cost of naming these explicitly — a new
# network suite must be added here — is the point rather than the drawback.
#
# `retries` rides with the group at binary granularity. These binaries contain
# the relay/discovery paths whose nondeterminism is tolerated, so they earn a
# second attempt; deterministic tests colocated in the same binaries inherit it.
# The two 10,000-iteration mechanics gates (plan 50: ceremony-frontier
# isolation and FROST sparsity) do real signing + journal work per iteration
# and legitimately run for minutes in the dev profile, slower still when
# nextest packs the whole suite onto every core. They get a wider budget
# instead of a weaker iteration count.
#
# Measured evidence for the budget below, both a single test on an idle machine
# with dependencies optimized (so the profile note above is not the cause):
# 83.6 s on a 12-core Windows dev box, 109.6 s on Linux — CPU-bound, one core
# saturated. The test is unchanged since it landed and passes everywhere; what
# moved is the size of the suite around it. nextest scales concurrency to
# num-cpus, so on GitHub's 2-core windows-latest those ~85 s of core time are
# shared with 737 other tests, and the wall clock ran past the 300 s this used
# to allow. 5 × 120 s keeps a genuine wedge surfacing within ten minutes while
# giving the slowest supported runner ~7× the measured single-machine time.
[[profile.default.overrides]]
filter = '''
    binary(mechanics)
    & (test(frontier_isolation_tests) + test(sparse_ceremony_tests))
'''
slow-timeout = { period = "120s", terminate-after = 5 }

# The smoke-scale performance gate builds a ~500-request corpus through the
# real daemon and restarts it twice. Measured evidence: ~27 s wall on a warm
# 12-core Windows dev box (dev profile); GitHub's 2-core windows-latest runner
# with the whole suite saturating both cores ran past the default 90 s cap.
# 5 × 120 s keeps a real wedge (a daemon that never answers Status) surfacing
# within 10 minutes while giving the slowest supported runner ~20× the
# measured single-machine time. The FULL corpus never runs under nextest —
# the orbital-perf workflow invokes this binary directly with its own budget.
[[profile.default.overrides]]
filter = '(binary_id(lait::it) & test(issues_reference_perf::))'
slow-timeout = { period = "120s", terminate-after = 5 }

# Plan 13's commit-cost baseline builds a durable Replica corpus at each small
# scale and measures a single-Body edit against it. Like the two gates above, it
# is CPU- and fsync-bound rather than waiting on anything, so it does not trip
# the default budget on a dev box and does on a shared 2-core runner.
#
# Measured evidence: 44.7 s for both tests on a 12-core Windows dev box, dev
# profile with dependencies optimized. GitHub's windows-latest ran it to 90 s
# and terminated — and the same commit passed in a parallel run, which is the
# signature of a test sitting on the boundary rather than one that regressed.
# 5 × 120 s gives the slowest supported runner ~13× the measured time while
# still surfacing a genuine wedge inside ten minutes.
#
# The `FULL` corpus (50k and 100k Bodies) never runs here; it is opt-in through
# `LAIT_COMMIT_BASELINE_FULL` and belongs to the perf workflow, which sets its
# own budget.
[[profile.default.overrides]]
filter = '(binary_id(lait::it) & test(commit_cost_baseline::))'
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.overrides]]
filter = '''
    (binary_id(lait::it) & test(orbital_join_iroh::))
    + (binary_id(lait::it) & test(restart_reconnect::))
    + (binary_id(lait::it) & test(guided_join::))
    + (binary_id(lait::it) & test(seed_registry::))
    + (binary_id(lait::it) & test(control_plane::))
    + (binary_id(lait::it) & test(cli_safety::))
    + (binary_id(runtime::it) & test(contact_iroh::))
    + (package(comms) & kind(test))
'''
test-group = 'network'
retries = 1

# ===========================================================================
# Tiers
# ===========================================================================
# A test suite has more than one job, and the jobs want different budgets. The
# profiles below name those jobs so the budget is a property of the tier rather
# than something re-argued per workflow.
#
#   default        every test, no exclusions — local dev, and any job that
#                  passes its own `-E` (a default-filter would silently narrow
#                  such a filter, which is precisely the failure the named
#                  gates exist to prevent).
#   pr             Linux, every push. Everything the nightly tier does not own.
#   pr-platform    Windows + macOS, every push. The OS seam only — see below.
#   nightly        everything at full count, plus the suites whose value is
#                  real rather than fast.
#
# What separates the tiers is not importance. It is whether the cost is paid
# per push by someone waiting. A 10,000-iteration FROST gate is not less
# important than a DTO fixture; it is a thing to learn about within a day
# rather than within a minute.

# The heavy set, measured on an idle 12-core dev box with dependencies built
# optimized (the `[profile.dev.package."*"]` note in Cargo.toml):
#
#   mechanics frontier_isolation_tests  143 s
#   mechanics sparse_ceremony_tests     133 s
#   lait      commit_cost_baseline       80 s
#   lait      issues_reference_perf     ~27 s, and restarts a real daemon twice
#
# Those four are ~85% of the suite's cost. The real-network suites join them
# not for time but for dependence: they put traffic on a staging relay, they
# carry `retries = 1` because that is nondeterministic by nature, and a relay
# hiccup should not be able to red a PR that did not touch networking. iroh
# itself draws this line the same way — netsim in CI, real relays sparingly.

[profile.pr]
# Linux, every push. `commit_cost_baseline` stays: it is 80 s on a dev box but
# the Linux runner does the whole suite in ~1 min, and a commit-cost regression
# is exactly the kind of thing that is cheap to catch now and expensive later.
default-filter = '''
    not (
        (binary_id(lait::it) & test(issues_reference_perf::))
        + (binary(mechanics) & (test(frontier_isolation_tests) + test(sparse_ceremony_tests)))
        + (binary_id(lait::it) & test(orbital_join_iroh::))
        + (binary_id(runtime::it) & test(contact_iroh::))
        + (package(comms) & kind(test))
    )
'''

[profile.pr-platform]
# Windows + macOS, every push. What these runners uniquely prove is that the
# OS seam holds, and most of that proof is the COMPILER's: a `cargo check
# --all-targets` is what fails the moment a `UnixStream` or `std::os::fd`
# reaches the control/lock path. What is left for tests is the behaviour no
# type check can see — a named pipe that binds, an advisory lock that excludes
# a second instance, a path that survives NTFS, a device name that is not a
# file, an fsync that lands.
#
# `kind(lib)` is that surface, and selecting it by KIND rather than by name is
# deliberate: every `cfg(windows)` / `cfg(unix)` island in this workspace lives
# in a crate's `src/`, so the unit tests of every crate cover the seam by
# construction and keep covering it when someone adds an island tomorrow. A
# hand-kept list of binary names would rot — the previous selector list rotting
# is why the commit before this one exists.
#
# The named binaries are the end-to-end half: the daemon actually spawning,
# actually binding its control channel, actually taking the single-instance
# lock, over the real OS rather than in-process.
#
# Excluded from `kind(lib)`: the two mechanics ceremony gates, which are CPU
# gates rather than platform gates — 10,000 iterations of real DKG proves the
# same thing on every OS, and on a 2-core windows-latest it proves it slowly.
default-filter = '''
    (
        kind(lib)
        + (binary_id(lait::it) & test(lait_daemon::))
        + (binary_id(lait::it) & test(control_plane::))
        + (binary_id(lait::it) & test(control_classification::))
        + (binary_id(lait::it) & test(live_control::))
        + (binary_id(lait::it) & test(restart_reconnect::))
        + (binary_id(lait::it) & test(cli_safety::))
        + (binary_id(lait::it) & test(cli_surfaces::))
        + (binary_id(lait::it) & test(seed_registry::))
        + (binary_id(lait::it) & test(station_lifecycle::))
        + (binary_id(lait::it) & test(content_ipc::))
    )
    - (binary(mechanics) & (test(frontier_isolation_tests) + test(sparse_ceremony_tests)))
'''

[profile.nightly]
# Everything, at full count, where nobody is waiting on it. The heavy suites
# get their own budgets here rather than inheriting a PR-shaped one; the
# workflow additionally sets LAIT_COMMIT_BASELINE_FULL and a raised
# PROPTEST_CASES, which are corpus-size knobs rather than nextest settings.
retries = 1

[[profile.nightly.overrides]]
filter = '''
    (binary_id(lait::it) & test(issues_reference_perf::))
    + (binary_id(lait::it) & test(commit_cost_baseline::))
    + (binary(mechanics) & (test(frontier_isolation_tests) + test(sparse_ceremony_tests)))
'''
slow-timeout = { period = "300s", terminate-after = 8 }

[[profile.nightly.overrides]]
filter = '''
    (binary_id(lait::it) & test(orbital_join_iroh::))
    + (binary_id(lait::it) & test(restart_reconnect::))
    + (binary_id(lait::it) & test(guided_join::))
    + (binary_id(lait::it) & test(seed_registry::))
    + (binary_id(lait::it) & test(control_plane::))
    + (binary_id(lait::it) & test(cli_safety::))
    + (binary_id(runtime::it) & test(contact_iroh::))
    + (package(comms) & kind(test))
'''
test-group = 'network'
retries = 2

[profile.mutants]
# The suite cargo-mutants runs against each surviving mutant.
#
# Mutation testing runs the tests once PER MUTANT, so what it costs is the
# suite's runtime multiplied by a few hundred. The default profile would put
# the two 140-second ceremony gates and the commit-cost baseline inside that
# multiplication, which turns a twenty-minute job into a week.
#
# What is left is the tests that could plausibly kill a mutant in the code being
# mutated — the generated suites and the fixtures around them. A mutant that
# only a real-network test would catch is a mutant this reports as surviving,
# and that is the honest answer: it means nothing deterministic covers it.
default-filter = '''
    (binary_id(fabric) + binary_id(fabric::it))
    + (binary_id(runtime) & (
        test(internal_tests::contact_frame_fuzz)
        + test(internal_tests::presence_wire_fuzz)
        + test(internal_tests::convergence_simulation)
        + test(internal_tests::freight_wire)
    ))
'''
