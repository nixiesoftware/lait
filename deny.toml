# cargo-deny: supply-chain gate. The load-bearing rule for this project is the
# `[bans]` list — it forbids the aws-lc-* rustls backends so the portable `ring`
# backend (which keeps cross-platform builds and easy cross-compiles working)
# can't drift back in transitively. Advisories and licenses round out the gate.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Everything ignored below is in the transitive tree of iroh 1.0.0-rc.1 (its
# network stack: netdev/netwatch/portmapper/plist, n0-error, etc.) or loro — not
# in code this project controls, and not fixable without an upstream release.
# Revisit and prune this list when iroh moves past rc / loro updates. New
# advisories NOT listed here still fail the gate.
ignore = [
    "RUSTSEC-2023-0089", # atomic-polyfill: unmaintained (transitive via iroh)
    "RUSTSEC-2024-0436", # paste: unmaintained (transitive via iroh)
    "RUSTSEC-2026-0190", # n0-error: unsound downcast_mut (iroh rc dep; upstream fix)
    "RUSTSEC-2026-0194", # transitive via iroh network stack
    "RUSTSEC-2026-0195", # transitive via iroh network stack
    "RUSTSEC-2026-0204", # quick-xml: alloc bound (transitive via iroh -> plist)
    # spin: 0.9.8 AND 0.10.0 are yanked upstream, pinned transitively via
    # heapless -> postcard -> iroh-gossip and via loro. No non-yanked version is
    # reachable without bumping that chain; drop this when iroh-gossip/loro do.
    { crate = "spin", reason = "all in-tree versions yanked upstream; transitive via iroh-gossip + loro" },
    # The four below arrived with typst 0.15.1 (products/issues-app), which
    # compiles issue documents. All are `unmaintained` notices rather than
    # vulnerabilities — no advisory here reports an exploitable defect — and all
    # sit under typst's rendering stack, which this project neither calls into
    # nor can upgrade independently. Drop each when typst does.
    "RUSTSEC-2025-0141", # bincode 1.x: unmaintained (typst-library -> syntect)
    "RUSTSEC-2026-0206", # rustybuzz: unmaintained (typst-layout, typst-library)
    "RUSTSEC-2026-0192", # ttf-parser: unmaintained (typst-library -> fontdb/rustybuzz)
    "RUSTSEC-2024-0320", # yaml-rust: unmaintained (typst-library -> syntect)
    # im and its helper crates are pinned transitively by loro 1.13.6. Replica
    # uses the maintained imbl fork directly; these exceptions can disappear
    # once loro does the same. The OrdSet defect is not exercised by Replica.
    "RUSTSEC-2023-0126", # im OrdSet aliasing violation (transitive via loro)
    "RUSTSEC-2026-0247", # bitmaps: unmaintained (transitive via loro -> im)
    "RUSTSEC-2026-0248", # im: unmaintained (transitive via loro)
    "RUSTSEC-2026-0251", # sized-chunks: unmaintained (transitive via loro -> im)
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Keep the portable `ring` TLS backend; never pull the aws-lc-* backends (they
# need cmake + a C toolchain, and NASM on Windows).
deny = [
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-fips-sys" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "0BSD",
]
# The iOS client is AGPL by decision (RustDesk's license); the exception is
# scoped to that one crate so the allowlist above stays the workspace's story.
exceptions = [
    { name = "astrolabe-ios", allow = ["AGPL-3.0-only"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
