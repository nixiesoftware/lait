[package]
name = "astrolabe-stub"
version = "0.1.0"
edition = "2021"
# MSRV: the workspace figure. See the root manifest for what drives it.
rust-version = "1.92"
license = "PolyForm-Noncommercial-1.0.0"
description = "The stub launcher: applies a verified staged tree by rename, then starts the client"
publish = false

[lints]
workspace = true

[[bin]]
name = "astrolabe-stub"
path = "src/main.rs"

# The subject of the macOS bundle-replacement measurement: a process that
# stays alive, built here so it is not a copied platform binary.
[[bin]]
name = "sleeper"
path = "src/bin/sleeper.rs"

# The chain test's reference entry binary — the "client" the stub launches
# in tools/astrolabe/tests/launch.rs. Built, never packaged.
[[bin]]
name = "chain-probe"
path = "src/bin/chain_probe.rs"

[lib]
name = "astrolabe_stub"
path = "src/lib.rs"

# Deliberately tiny. The stub survives updates, so every dependency here is a
# reason it might have to change; nothing async, nothing that talks to a
# network, nothing that parses anything but its own stage manifest.
[dependencies]
blake3 = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The macOS bundle exchange is one syscall, and it is the only place this
# crate reaches past std.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The installer asks the stable stub to register the independently shipped
# `lait` sidecar on the current user's PATH. Direct Win32 registry calls avoid
# NSIS's 1024-character string ceiling, which can corrupt an existing PATH.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
