[package]
name = "astrolabe"
version = "0.1.0"
edition = "2021"
# MSRV: the workspace figure. See the root manifest for what drives it.
rust-version = "1.92"
description = "The local client through which a person reaches the Worlds their device serves"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
name = "astrolabe"
path = "src/lib.rs"
# `cdylib` is what the Flutter runner links; `rlib` is what the workspace's own
# tests link. Both, because the core is one thing with two consumers and
# building it twice would let them disagree.
crate-type = ["cdylib", "rlib"]

[dependencies]
lait = { path = "../.." }
lait-workbench = { path = "../workbench" }
addressbook = { path = "../../crates/addressbook" }
mechanics = { path = "../../crates/mechanics" }
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# The bridge to the Dart interface. `MIT`, so lait's dual offer is untouched.
# The generated Dart and the generated Rust are both checked in, and CI fails on
# drift — the boundary revision 7 reintroduced is only safe if a stale binding
# cannot pass review.
flutter_rust_bridge = "=2.12.0"

[target.'cfg(windows)'.dependencies]
# The single-instance mutex, the tray icon and the browser handoff. All three
# are Windows shapes rather than portable ones — a kernel object rather than an
# advisory file lock, a shell notification area, and `ShellExecuteW` rather than
# a console-subsystem child that would flash a window. Reached directly because
# a crate for each would be three more entries in a closure that a build-failing
# licence audit and a generated notice file both have to carry.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The staged-swap chain test seals its own feed and builds its own tree
# artifacts; these carry the envelope, digest, and archive shapes and are
# already in the lockfile via the root crate.
blake3 = "1"
data-encoding = "2.6"
flate2 = "1"
tar = "0.4"
jiff = "0.2.35"
replica = { path = "../../crates/replica" }
schedule = { path = "../../crates/schedule" }
signage = { package = "lait-signage", path = "../../products/signage" }
signage-app = { package = "lait-signage-app", path = "../../products/signage-app" }
tempfile = "3"
