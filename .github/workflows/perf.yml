# IssuesWorld reference performance gate (plan 50). The default CI suite runs
# the same harness at smoke scale on every commit; this workflow runs the FULL
# frozen corpus (benchmarks/issues-reference.json — 20 projects, 50k issues,
# per-issue events/labels, incremental tail) through the public daemon surface
# on the pinned runner image, uploads every sample + peak RSS as an artifact,
# and gates p95 regressions once baselines are frozen in the spec.
name: perf

# NOT a PR gate: the full corpus is hours of daemon traffic by design (it
# measures the real product surface, not a fixture), so it runs as a
# scheduled benchmark plus on-demand dispatch. PRs pay only the smoke-scale
# run inside the default test suite. NOTE: both `schedule` and
# `workflow_dispatch` only take effect once this file exists on the default
# branch — the first full run (and the baseline freeze) happens after merge.
on:
  workflow_dispatch:
  schedule:
    # Weekly, off-peak.
    - cron: "17 3 * * 1"

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  orbital-perf:
    name: orbital-perf (issues-reference, full corpus)
    runs-on: [self-hosted, lait]
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run the full reference corpus
        env:
          LAIT_PERF_FULL: "1"
        run: cargo test --release --locked --test issues_reference_perf -- --nocapture
      - name: Upload sample artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issues-reference-report
          path: target/perf/issues-reference-report.json
          if-no-files-found: error

      # FIND-5's focused diagnostic is deliberately separate from the public-
      # socket reference corpus above. It fixes the scales at 1k/10k/50k and
      # records the structural work (Body parses/scans, edge visits, allocation
      # traffic and returned bytes) that explains the end-to-end wall.
      - name: Issues scan baseline (Rust, full corpus)
        env:
          LAIT_ISSUES_SCAN_FULL: "1"
        run: |
          mkdir -p target/perf
          cargo test --release --locked -p lait-issues \
            scan_baseline::current_issue_scan_work_is_measured_at_cold_and_warm_roots \
            --lib -- --nocapture --exact 2>&1 | tee target/perf/issues-scan-rust-report.log

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci
        working-directory: viewer
      - name: Issues scan baseline (browser, full corpus)
        env:
          LAIT_ISSUES_SCAN_FULL: "1"
          LAIT_BROWSER_SCAN_REPORT: ${{ github.workspace }}/target/perf/issues-scan-browser-report.json
        run: npm test -- src/core/issueSearch.test.ts
        working-directory: viewer
      - name: Upload Issues scan diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issues-scan-reports
          path: target/perf/issues-scan-*-report.*
          if-no-files-found: warn
