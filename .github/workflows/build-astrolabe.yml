name: Build Astrolabe

# Native builder for the canonical Tauri client. It uploads short-lived Actions
# artifacts for the calling Release workflow; the signed GCS feed, not GitHub,
# is the distribution boundary.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to build
        required: true
        type: string
      version:
        description: SemVer embedded in the client and sidecar pair
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  windows:
    name: Astrolabe Windows installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/astrolabe-web/package-lock.json
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            apps/astrolabe-web/src-tauri
          key: astrolabe-windows
      - name: Install the pinned interface dependencies
        working-directory: apps/astrolabe-web
        run: npm ci
      - name: Build the same-tree client and sidecar pair
        shell: bash
        run: packaging/build-astrolabe.sh --version "${{ inputs.version }}" --out dist
      - name: Attest the installer
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/astrolabe-${{ inputs.version }}-setup.exe
      - name: Attest the immutable update tree
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/astrolabe-tree-${{ inputs.version }}-x86_64-pc-windows-msvc.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolabe-windows
          path: |
            dist/astrolabe-${{ inputs.version }}-setup.exe
            dist/astrolabe-${{ inputs.version }}-setup.exe.sha256
            dist/astrolabe-tree-${{ inputs.version }}-x86_64-pc-windows-msvc.tar.gz
            dist/astrolabe-tree-${{ inputs.version }}-x86_64-pc-windows-msvc.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: Astrolabe signed macOS disk image
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/astrolabe-web/package-lock.json
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            apps/astrolabe-web/src-tauri
          key: astrolabe-macos
      - name: Install the pinned interface dependencies
        working-directory: apps/astrolabe-web
        run: npm ci
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::the certificate contains no Developer ID Application identity"; exit 1; }
          echo "MACOS_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Store the notarization credential
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials ci-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/notary.p8"
      - name: Build, sign, notarize, and staple the same-tree pair
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          packaging/build-astrolabe.sh --version "$VERSION" --out dist \
            --identity "$MACOS_IDENTITY" --notarize ci-notary
      - name: Attest the disk image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/astrolabe-${{ inputs.version }}.dmg
      - name: Attest the immutable update tree
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/astrolabe-tree-${{ inputs.version }}-aarch64-apple-darwin.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolabe-macos
          path: |
            dist/astrolabe-${{ inputs.version }}.dmg
            dist/astrolabe-${{ inputs.version }}.dmg.sha256
            dist/astrolabe-tree-${{ inputs.version }}-aarch64-apple-darwin.tar.gz
            dist/astrolabe-tree-${{ inputs.version }}-aarch64-apple-darwin.tar.gz.sha256
          if-no-files-found: error

  linux:
    name: Astrolabe Linux bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/astrolabe-web/package-lock.json
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            apps/astrolabe-web/src-tauri
          key: astrolabe-linux
      - name: Install the webview toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Install the pinned interface dependencies
        working-directory: apps/astrolabe-web
        run: npm ci
      - name: Build the same-tree client and sidecar pair
        run: packaging/build-astrolabe.sh --version "${{ inputs.version }}" --out dist
      - name: Attest the bundle
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/astrolabe-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz
      - name: Attest the immutable update tree
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/astrolabe-tree-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolabe-linux
          path: |
            dist/astrolabe-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            dist/astrolabe-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/astrolabe-tree-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            dist/astrolabe-tree-${{ inputs.version }}-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
