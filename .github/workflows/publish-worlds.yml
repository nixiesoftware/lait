name: World Candidate

# Build one complete, native, commit-addressed World candidate. The candidate
# is the immutable byte set the hostile-install and real-data audits exercise.
# This workflow moves no channel and holds no signing key: publication is a
# separate, local act — `ci/publish-world.sh --from-run` consumes the audited
# run's artifact, and the feed signing seed never leaves the maintainer
# machine performing it.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-worlds.yml
      - .github/scripts/stage-worlds.sh
      - ci/publish-world.sh
      - tools/feed/**
      - crates/world-interface/**
      - crates/world-runner/**
      - crates/world-sdk/**
      - crates/runtime/**
      - products/issues/**
      - products/issues-app/**
      - products/issues-runner/**
      - products/signage/**
      - products/signage-app/**
      - products/signage-runner/**
      - products/issues-app/assets/web/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

concurrency:
  group: world-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  gate:
    name: decide which immutable releases are new
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      issues-needed: ${{ steps.releases.outputs.issues-needed }}
      signage-needed: ${{ steps.releases.outputs.signage-needed }}
      any-needed: ${{ steps.releases.outputs.any-needed }}
      issues-version: ${{ steps.releases.outputs.issues-version }}
      signage-version: ${{ steps.releases.outputs.signage-version }}
      sha: ${{ steps.releases.outputs.sha }}
      short-sha: ${{ steps.releases.outputs.short-sha }}
      artifact: ${{ steps.releases.outputs.artifact }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: releases
        name: Refuse to rebuild an occupied release coordinate
        shell: bash
        run: |
          set -euo pipefail
          base=https://storage.googleapis.com/the-foundation-dist

          version_of() {
            sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1
          }
          needs_release() {
            local world="$1" version="$2" status
            status="$(curl --retry 5 --retry-all-errors -sS -o /dev/null \
              -w '%{http_code}' "$base/releases/worlds/$world/$version/manifest.json")"
            case "$status" in
              200)
                echo "==> $world $version is already immutable; skipping its rebuild" >&2
                printf false
                ;;
              404) printf true ;;
              *)
                echo "unexpected HTTP $status while checking $world $version" >&2
                exit 1
                ;;
            esac
          }

          issues_version="$(version_of products/issues/Cargo.toml)"
          signage_version="$(version_of products/signage/Cargo.toml)"
          [ -n "$issues_version" ] && [ -n "$signage_version" ]
          sha="$(git rev-parse HEAD)"
          short_sha="${sha:0:12}"
          issues_needed="$(needs_release com.lait.issues "$issues_version")"
          signage_needed="$(needs_release com.lait.signage "$signage_version")"
          any_needed=false
          if [ "$issues_needed" = true ] || [ "$signage_needed" = true ]; then
            any_needed=true
          fi
          echo "issues-needed=$issues_needed" >> "$GITHUB_OUTPUT"
          echo "signage-needed=$signage_needed" >> "$GITHUB_OUTPUT"
          echo "any-needed=$any_needed" >> "$GITHUB_OUTPUT"
          echo "issues-version=$issues_version" >> "$GITHUB_OUTPUT"
          echo "signage-version=$signage_version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short-sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "artifact=world-candidate-$short_sha" >> "$GITHUB_OUTPUT"

  build:
    name: build World runners (${{ matrix.target }})
    needs: gate
    if: ${{ needs.gate.outputs.any-needed == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: world-${{ matrix.target }}
      - name: Build independent runners
        run: cargo build --release --locked --target ${{ matrix.target }} -p lait-issues-runner -p lait-signage-runner
      - name: Assemble immutable release trees
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/stage-worlds.sh "${{ matrix.target }}" stage
          tar czf "world-bundles-${{ matrix.target }}.tar.gz" -C stage worlds
          sha256sum "world-bundles-${{ matrix.target }}.tar.gz" \
            > "world-bundles-${{ matrix.target }}.tar.gz.sha256"
      - name: Attest the native World candidate
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: world-bundles-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-bundles-${{ matrix.target }}
          path: |
            world-bundles-${{ matrix.target }}.tar.gz
            world-bundles-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  candidate:
    name: assemble the commit-addressed World candidate
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: world-bundles-*
          path: candidate
          merge-multiple: true
      - name: Verify every native byte set against its checksum and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          cd candidate
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            aarch64-apple-darwin
            x86_64-apple-darwin
            x86_64-pc-windows-msvc
          )
          for target in "${targets[@]}"; do
            [ -f "world-bundles-$target.tar.gz" ] \
              || { echo "::error::missing world-bundles-$target.tar.gz"; exit 1; }
            sha256sum -c "world-bundles-$target.tar.gz.sha256"
            gh attestation verify "world-bundles-$target.tar.gz" \
              --repo "$GITHUB_REPOSITORY" --source-digest "$SOURCE_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-worlds.yml" \
              > /dev/null
          done
      - name: Record the immutable candidate coordinate
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          ISSUES_VERSION: ${{ needs.gate.outputs.issues-version }}
          SIGNAGE_VERSION: ${{ needs.gate.outputs.signage-version }}
        run: |
          set -euo pipefail
          printf 'source_sha=%s\nissues_version=%s\nsignage_version=%s\n' \
            "$SOURCE_SHA" "$ISSUES_VERSION" "$SIGNAGE_VERSION" \
            > candidate/world-candidate-provenance.env
          (cd candidate && sha256sum world-candidate-provenance.env \
            > world-candidate-provenance.env.sha256)
      - name: Attest the candidate coordinate
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate/world-candidate-provenance.env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.gate.outputs.artifact }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Record the audit and publication coordinates
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          ARTIFACT: ${{ needs.gate.outputs.artifact }}
          ISSUES_NEEDED: ${{ needs.gate.outputs.issues-needed }}
          SIGNAGE_NEEDED: ${{ needs.gate.outputs.signage-needed }}
          ISSUES_VERSION: ${{ needs.gate.outputs.issues-version }}
          SIGNAGE_VERSION: ${{ needs.gate.outputs.signage-version }}
        run: |
          {
            echo "### Commit-addressed World candidate"
            echo "Audit artifact \`$ARTIFACT\` from commit \`$SOURCE_SHA\` before any channel moves."
            echo '```sh'
            if [ "$ISSUES_NEEDED" = true ]; then
              echo "ci/publish-world.sh --world com.lait.issues --version $ISSUES_VERSION --from-run $RUN_ID --artifact-name $ARTIFACT --channel test --seed ~/.lait-feed-signing.seed"
              echo "ci/publish-world.sh --world com.lait.issues --version $ISSUES_VERSION --channel stable --promote --seed ~/.lait-feed-signing.seed"
            fi
            if [ "$SIGNAGE_NEEDED" = true ]; then
              echo "ci/publish-world.sh --world com.lait.signage --version $SIGNAGE_VERSION --from-run $RUN_ID --artifact-name $ARTIFACT --channel test --seed ~/.lait-feed-signing.seed"
              echo "ci/publish-world.sh --world com.lait.signage --version $SIGNAGE_VERSION --channel stable --promote --seed ~/.lait-feed-signing.seed"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
