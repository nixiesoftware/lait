# Cross-platform CI + supply-chain gate. Builds, lints, and tests lait on
# Linux, macOS, and Windows so the daemon's control channel + single-instance
# lock stay portable. The Windows job is load-bearing — it fails the moment
# anyone reintroduces a unix-only API (a Unix-domain socket, flock(2), os::fd, …)
# into the control/lock path.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The retired Flutter desktop client has no CI or release path. The canonical
  # Tauri interface is gated below as both frontend and native host.
  #
  # The iOS boundary is a third, and it is a *cost* decision rather than a
  # credential one. `apps/astrolabe-ios/build-core.sh` says CI's drift check is
  # `git diff --exit-code` over `Generated/` after it runs, and no workflow does
  # that. The `platform` matrix below already pays for a macos-latest runner, so
  # checkout and toolchain are sunk; what is not sunk is an Apple target install
  # plus the staticlib build, and that build is the one the script's own comment
  # calls "the ~2 GB archive nobody on the host links". Adding it to the macOS
  # leg is a few minutes and several GB on every run. Worth it or not is a call
  # for whoever owns CI spend — it is recorded here so it stays a decision
  # instead of decaying back into an oversight.

  # The five television receivers. Their conformance suites existed and nothing
  # ran them, so `crates/display-protocol`'s language-neutral fixtures were
  # verified on the Rust side only — the independent implementations they exist
  # to hold honest were checked by hand or not at all.
  #
  # Cheap enough that there was never a reason to leave them out: the shared,
  # webOS, Tizen, tvOS and Android TV suites are bare `node --test` with no npm
  # dependencies of any kind. Only Roku installs anything, for the BrightScript
  # compiler its `check` script runs before the tests.
  #
  # These are the *conformance* half, not qualification. Nothing here touches a
  # television; `receivers/QUALIFICATION.md` is still the gate for that, and it
  # is still unrecorded.
  receivers:
    name: receivers (conformance)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: receivers/roku/package-lock.json

      # The Rust-owned fixtures, run against the shared web implementation the
      # webOS and Tizen packages both copy from.
      - name: Shared web protocol
        run: npm test
        working-directory: receivers

      - name: webOS
        run: npm test
        working-directory: receivers/webos

      - name: Tizen
        run: npm test
        working-directory: receivers/tizen

      - name: Android TV
        run: node --test
        working-directory: receivers/android-tv

      - name: Apple TV
        run: npm test
        working-directory: receivers/tvos

      # `npm ci` (not `install`) so the lockfile is authoritative, matching the
      # viewer job. Roku's `test` runs the BrightScript compiler first, which is
      # the one receiver dependency in the tree.
      - name: Install Roku toolchain
        run: npm ci
        working-directory: receivers/roku

      - name: Roku
        run: npm test
        working-directory: receivers/roku

  # Astrolabe's TypeScript client is independent of the World web clients.
  # The Astrolabe client. It had no gate at all — 19k lines, and neither half
  # was compiled, typechecked or tested by anything. What that cost was visible:
  # `src-tauri` is not a workspace member, so `cargo check --workspace` never
  # touched it, and the app could not build on Windows *at any point* because
  # `tauri-build` wants an `icons/icon.ico` that did not exist. That sat in a
  # green pull request.
  #
  # The TypeScript half is gated here, which needs nothing but node. The Rust
  # host is gated by `astrolabe-web-host` below, which does need system
  # libraries — kept a separate job so a missing webkit package fails as
  # itself rather than as "the client is broken".
  astrolabe-web:
    name: astrolabe-web (client)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/astrolabe-web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/astrolabe-web

      - name: Typecheck
        run: npm run check
        working-directory: apps/astrolabe-web

      - name: Test
        run: npm test
        working-directory: apps/astrolabe-web

  # The client's Rust host, which `cargo check --workspace` cannot reach: it is
  # deliberately outside the workspace so that the main build does not require
  # a webview toolchain. That exclusion is the reason it needs a job of its own
  # rather than the reason it needs none.
  astrolabe-web-host:
    name: astrolabe-web (host)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            apps/astrolabe-web/src-tauri

      # What tauri links against on Linux. Pinned to the 4.1 series because
      # tauri 2 does not build against 4.0.
      - name: Install the webview toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/astrolabe-web/package-lock.json

      # `tauri-build` reads `frontendDist`, so the host does not compile until
      # the frontend has been built once.
      - name: Build the frontend the host embeds
        run: npm ci && npm run build
        working-directory: apps/astrolabe-web

      # `tauri-build` validates both `bundle.externalBin` and every resource
      # directory even for `cargo check`. Use the production staging command so
      # this gate proves the host sees the daemon and reviewed catalog while the
      # production stage keeps executable World payloads out of the bundle.
      - name: Stage the lait sidecar and reviewed World catalog
        run: npm run stage-bundle
        working-directory: apps/astrolabe-web

      - name: Check
        run: cargo check --all-targets
        working-directory: apps/astrolabe-web/src-tauri

  # `cargo install lait` must not need npm (docs/SERVE.md). Committed build output
  # goes stale the first time someone edits viewer/ and forgets to rebuild — and
  # it would go stale *silently*, shipping a binary whose UI predates its API. So
  # this job rebuilds and fails if the result differs from what's in git.
  viewer:
    name: viewer
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # SHA-pinned like every other action here: a tag is mutable, and CI is
      # exactly where you don't want a dependency that can change under you.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # `npm ci` (not `install`) so the lockfile is authoritative and CI cannot
      # quietly resolve a different tree than a developer did.
      - name: Install
        run: npm ci
        working-directory: viewer

      - name: Typecheck
        run: npm run check
        working-directory: viewer

      - name: Test
        run: npm test
        working-directory: viewer

      - name: Build
        run: npm run build
        working-directory: viewer

      - name: Assert the committed Issues bundle is what viewer/ builds
        run: |
          if ! git diff --exit-code --stat -- products/issues-app/assets/web; then
            echo "::error::the Issues web release is stale — run 'npm run build' in viewer/ and commit the result."
            exit 1
          fi

      # Naming is not a Rust-only rule: the viewer declares the same DTO shapes
      # in TypeScript. `semantic_type_names` walks the Rust tree with syn; this
      # walks the TypeScript tree with tsc's own parser. Both must be green for
      # the rule to mean what it says. It lives here rather than in its own job
      # because this job has already paid for `npm ci`.
      - name: Semantic naming (TypeScript)
        run: npm run naming-gate
        working-directory: viewer

  # The Signage operator client, on the same terms as the Issues one above: its
  # bundle is committed as part of the independently shipped Signage release, so
  # the only thing keeping it honest is a job that rebuilds it and diffs.
  #
  # Signage declares a primary web launch target, which is what puts an Open
  # button on its Library row. A stale or missing bundle therefore does not
  # degrade quietly — it opens a head with nothing to serve.
  signage-web:
    name: signage-web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/signage-app/web/package-lock.json

      # The client declares `npm >= 11`, and Node 22 bundles npm 10.9 — so the
      # runner fails `npm ci` on EBADENGINE before it reads a single dependency.
      # Satisfy the declaration rather than relaxing it: the lockfile was
      # resolved by npm 11, and letting an older npm rewrite it is exactly the
      # drift the `npm ci` in the next step exists to prevent.
      - name: Match the declared npm
        run: npm install -g npm@^11

      - name: Install
        run: npm ci
        working-directory: products/signage-app/web

      - name: Typecheck
        run: npm run check
        working-directory: products/signage-app/web

      - name: Lint
        run: npm run lint
        working-directory: products/signage-app/web

      # `resolve.ts` is the reason this step matters — it is a second
      # implementation of the resolution ladder that `fleet.rs` owns, and a
      # twin nobody tests is a twin that drifts.
      - name: Test
        run: npm test
        working-directory: products/signage-app/web

      - name: Build
        run: npm run build
        working-directory: products/signage-app/web

      - name: Assert the committed Signage bundle is what the client builds
        run: |
          if ! git diff --exit-code --stat -- products/signage-app/assets/web; then
            echo "::error::the Signage web release is stale — run 'npm run build' in products/signage-app/web/ and commit the result."
            exit 1
          fi

  # ===========================================================================
  # The PR path. Two jobs, split by what each one uniquely proves.
  # ===========================================================================
  # This used to be one matrix running the entire workspace suite on three
  # operating systems. It was thorough and it was also the whole wait: measured
  # on a green run, `check (windows-latest)` took 19 min of a 20 min workflow —
  # build 6.6 min, test 10.4 min — while the Linux leg did identical work in 3.
  #
  # Windows was not slow because the tests are hard. It was slow because a
  # hosted windows-latest linked eighty test binaries against iroh + loro +
  # frost on two cores. Paying that per push bought one thing: proof that the
  # OS seam holds. That proof is worth keeping and is available far more
  # cheaply, so the two jobs below buy it separately — `test` runs the suite
  # where it is fast, and `platform` runs the seam where the seam lives.
  #
  # The eighty is now eighteen: every package's integration tests were folded
  # into a single `tests/it/` target, so the workspace links seventeen test
  # binaries plus the bin rather than eighty-one. That change is what makes a
  # one-line edit rebuild in 32 s locally instead of 111 s.
  #
  # The full cross-platform suite has not been deleted. It moved to `nightly.yml`
  # and to the merge path, where its latency is nobody's.

  # Linux, every push: the whole suite except what the nightly tier owns.
  test:
    name: test (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # dtolnay/rust-toolchain@stable (branch head at time of pinning). The ref used
      # to select the channel, so `toolchain` is now passed explicitly.
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # nextest runs test binaries in PARALLEL; `cargo test` runs them serially, so
      # the multi-node integration suite paid the sum of per-binary times. Prebuilt
      # binary install — no compile cost.
      # taiki-e/install-action@nextest (the maintainer re-points this tag, so it is
      # a moving target with no semver equivalent). The ref used to select the tool,
      # so `tool` is now passed explicitly.
      - name: Install nextest
        uses: taiki-e/install-action@e658debeddbabf20b2b866d9235eb08a2375b1ad
        with:
          tool: nextest

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        # Every production crate root denies the crash/error-safety lint set
        # under `not(test)`, while test targets intentionally permit those
        # tools for assertions and fault simulation. Do not promote advisory
        # pedantic/nursery warnings here: that would erase that boundary and
        # make stylistic suggestions fail every target, including tests.
        run: cargo clippy --workspace --all-targets --all-features --locked

      # --locked pins the committed Cargo.lock, so the portable dependency set
      # (interprocess, fs2, and the `ring` TLS backend) can't drift under CI.
      # --workspace is load-bearing on every cargo invocation in this job: the
      # root package plus six concept crates form the workspace, and a bare
      # `cargo test`/`nextest run` covers ONLY the root package — silently
      # skipping every mechanics/fabric/replica/runtime/comms/journal suite.
      - name: Build
        run: cargo build --workspace --locked --all-targets --all-features

      # Publish real signed World archives into an explicit local channel.
      # Process tests install them through the updater boundary; no runner is
      # discovered beside the host and no installation record is synthesized.
      - name: Publish independent World channels for process tests
        shell: bash
        run: |
          set -euo pipefail
          feed="$PWD/target/debug/lait-feed"
          [ -x "$feed" ] || feed="$PWD/target/debug/lait-feed.exe"
          channels="$RUNNER_TEMP/world-fixture-channels"
          mkdir -p "$channels"
          bash ci/prepare-independent-world-fixtures.sh \
            "$channels" "$PWD/target/debug" "$feed"
          installer="$PWD/target/debug/world-channel-installer"
          [ -x "$installer" ] || installer="$PWD/target/debug/world-channel-installer.exe"
          # Git Bash spells Windows paths as /c/..., but these values are
          # consumed by native Rust processes after this shell exits.
          if command -v cygpath >/dev/null 2>&1; then
            channels="$(cygpath -w "$channels")"
            installer="$(cygpath -w "$installer")"
          fi
          echo "WORLD_FIXTURE_CHANNELS=$channels" >> "$GITHUB_ENV"
          echo "WORLD_FIXTURE_INSTALLER=$installer" >> "$GITHUB_ENV"

      # The `pr` profile in .config/nextest.toml is the tier definition: the
      # whole suite minus the four heavy gates and the real-network suites,
      # which `nightly.yml` runs at full count. Naming a PROFILE rather than an
      # inline `-E` keeps the tier reproducible locally with one command —
      # `cargo nextest run --profile pr` is what CI runs.
      - name: Test
        run: cargo nextest run --workspace --locked --all-features --profile pr

      # nextest does not run doctests; run them explicitly so documented examples
      # (and the DTO/parity doc examples) can't rot.
      - name: Doctests
        run: cargo test --workspace --locked --doc --all-features

      - name: Portability guard (no unix-only APIs in control/lock path)
        shell: bash
        run: bash ci/portability-guard.sh

      # A ratchet, not a ban — see the script's header. The convergence path
      # lost the same diagnostic four separate times to `map_err(|_| …)` at a
      # seam; this stops a fifth from arriving unreviewed.
      - name: Error-context guard (convergence path keeps its causes)
        shell: bash
        run: bash ci/error-context-guard.sh

      - name: Smoke run (P0 tracker flow)
        shell: bash
        run: bash ci/smoke-p0.sh linux

      - name: Assert portable TLS backend (no aws-lc-*)
        shell: bash
        run: bash ci/assert-portable-tls.sh

      # `cargo deny check licenses` is the gate — it fails on a denied licence
      # anywhere in the closure. This is the record a person who receives a lait
      # binary is owed, and it is here because a notice file that is only
      # generated at release time is one nobody reviews. Unlike the coverage
      # manifest, it is platform-independent: `cargo metadata` resolves every
      # target, so it can be regenerated anywhere.
      - name: Third-party notices are current
        shell: bash
        run: bash ci/third-party-notices.sh --check

      - name: Upload the corrected notices
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.md.actual
          if-no-files-found: ignore

  # Windows + macOS, every push: the OS seam.
  #
  # Two steps carry this job. `Typecheck` compiles every target in the
  # workspace WITHOUT linking test binaries, and that is the portability gate
  # proper — a `UnixStream`, an `std::os::fd`, an `flock(2)` reaching the
  # control/lock path fails to compile here, which is what the guard script has
  # always said is the primary mechanism. On the old matrix that step took
  # 1.3 min while the link-everything build took 6.6.
  #
  # `Test` then runs what no type check can see: a named pipe that binds, an
  # advisory lock that excludes a second instance, a path that survives NTFS, a
  # device name that is not a file, an fsync that lands. That set is
  # `[profile.pr-platform]` — every crate's unit tests (where every cfg-gated
  # island in this workspace lives) plus the integration tests that drive a
  # real daemon over a real control channel. 935 tests, eleven binaries.
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, blacksmith-4vcpu-windows-2025]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install nextest
        uses: taiki-e/install-action@e658debeddbabf20b2b866d9235eb08a2375b1ad
        with:
          tool: nextest

      # The portability gate. `--all-targets` matters: it type-checks the test
      # targets too, so a unix-only API cannot enter through a test helper that
      # production code later reaches for.
      #
      # `check`, not `clippy`. This step exists to answer "does every target
      # compile on this OS", which is a type-resolution question — a
      # `UnixStream` or `std::os::fd` on Windows fails here exactly as it would
      # under clippy, and `check` stops at metadata instead of running the lint
      # driver over the whole graph. It also stops paying for a full second
      # build: clippy's artifacts carry a different fingerprint from rustc's, so
      # `clippy --all-targets` followed by `nextest run` compiles the workspace
      # twice. Measured cold on macOS, that was 4.2 min of typecheck followed by
      # 8.7 min of test, most of it the same crates compiled again.
      #
      # Per-OS LINTING still has value — a clippy lint inside a `cfg(windows)`
      # island is invisible to the Linux job — but it is a nightly concern, not
      # something to pay for on every push. nightly.yml's full matrix runs it.
      - name: Typecheck (all targets, this OS)
        run: cargo check --workspace --all-targets --all-features --locked

      # Two invocations so the BUILD is restricted to the seam as well as the
      # run: eleven test binaries instead of eighteen. `[profile.pr-platform]`
      # decides what RUNS in both, so the tier stays defined in one place.
      #
      # This used to derive a ten-name target list from that profile with a
      # script, because writing the list twice was how five gates went stale.
      # Consolidating the integration tests removed the list: every package now
      # has exactly one `it` binary, so "all the unit tests, plus lait's
      # integration binary" is a structural statement rather than a roster that
      # can rot.
      # The bins come first because the tests that spawn them deliberately
      # panic — not skip — when they are not beside the test binary. That rule
      # covers the `--lib` run below as well as the launch seam further down:
      # `astrolabe-stub`'s macOS bundle measurement spawns `sleeper`, and it
      # lives in the LIB, so `--lib` runs it while `--lib` also declines to
      # build any `[[bin]]`. The build used to sit between the two, which is
      # why that measurement passed on Linux (where it is cfg'd out) and
      # panicked on macOS the first release it existed for.
      #
      # `sleeper` is named here for the same reason it is built at all: a copy
      # of /bin/sleep is not a valid subject, so there is no fallback the test
      # could quietly take instead.
      - name: Build the binaries the seam tests spawn
        run: cargo build --locked --all-features -p lait -p astrolabe-stub -p lait-feed -p world-channel-installer -p lait-issues-runner -p lait-signage-runner -p astrolabe-display-reference --bin lait --bin astrolabe-stub --bin chain-probe --bin sleeper --bin lait-feed --bin world-channel-installer --bin lait-world-issues --bin lait-world-signage --bin astrolabe-display-reference

      - name: Publish independent World channels for process tests
        shell: bash
        run: |
          set -euo pipefail
          feed="$PWD/target/debug/lait-feed"
          [ -x "$feed" ] || feed="$PWD/target/debug/lait-feed.exe"
          channels="$RUNNER_TEMP/world-fixture-channels"
          mkdir -p "$channels"
          bash ci/prepare-independent-world-fixtures.sh \
            "$channels" "$PWD/target/debug" "$feed"
          installer="$PWD/target/debug/world-channel-installer"
          [ -x "$installer" ] || installer="$PWD/target/debug/world-channel-installer.exe"
          # Git Bash spells Windows paths as /c/..., but these values are
          # consumed by native Rust processes after this shell exits.
          if command -v cygpath >/dev/null 2>&1; then
            channels="$(cygpath -w "$channels")"
            installer="$(cygpath -w "$installer")"
          fi
          echo "WORLD_FIXTURE_CHANNELS=$channels" >> "$GITHUB_ENV"
          echo "WORLD_FIXTURE_INSTALLER=$installer" >> "$GITHUB_ENV"

      - name: Test (OS seam — unit tests, every crate)
        run: cargo nextest run --workspace --locked --all-features --profile pr-platform --lib

      - name: Test (OS seam — daemon, control channel, single-instance lock)
        run: cargo nextest run -p lait --locked --all-features --profile pr-platform --test it

      # The client-to-process seam, on the OSes where it historically broke.
      # `[profile.pr-platform]` has named astrolabe::launch and
      # astrolabe::packaging since the tiering landed, but the two target
      # restrictions above never COMPILED them here — the filter decides what
      # runs, the flags decide what builds, and the seam quietly ran on Linux
      # only again (found and recorded on CLIENT-65).
      - name: Test (OS seam — client launch chain, staged swap, packaging)
        run: cargo nextest run -p astrolabe --locked --all-features --profile pr-platform --test launch --test packaging

      - name: Portability guard (no unix-only APIs in control/lock path)
        shell: bash
        run: bash ci/portability-guard.sh

      # The smoke reuses the real binary built for the launch seam above —
      # one link, and it is the link that matters most on this OS.
      - name: Smoke run (P0 tracker flow)
        shell: bash
        run: bash ci/smoke-p0.sh "${{ matrix.os }}"

      - name: Assert portable TLS backend (no aws-lc-*)
        shell: bash
        run: bash ci/assert-portable-tls.sh

  # ===========================================================================
  # Coverage integrity, without re-running the suite to prove it.
  # ===========================================================================
  # Twelve `orbital-*` jobs used to live here, each re-running a named slice of
  # the suite that `check` had already run minutes earlier. Their own comment
  # said so: "the full workspace suite in `check` subsumes these tests". The
  # reason to keep them anyway was real — a deleted or renamed gate should turn
  # a green aggregate red rather than silently narrowing coverage.
  #
  # Re-executing tests is an expensive way to assert that tests EXIST: twelve
  # jobs, ~23 runner-minutes per push. It was also weaker than it looked. The
  # mechanism was nextest's exit-4 "filter matched nothing", so deleting one
  # test from a module that still had others left every gate green.
  #
  # `ci/coverage-manifest.sh` asserts the property directly and catches that
  # case: it records every test id in the workspace plus what each tier and
  # each named gate selects, and fails when the recording stops matching. A
  # coverage change becomes a reviewable diff instead of a surprise.
  coverage-manifest:
    name: coverage manifest
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install nextest
        uses: taiki-e/install-action@e658debeddbabf20b2b866d9235eb08a2375b1ad
        with:
          tool: nextest
      # `nextest list` compiles the test targets but runs nothing, so this
      # costs a build and seconds of walking, not a suite.
      - name: Assert the coverage manifest is current
        id: manifest
        continue-on-error: true
        shell: bash
        run: bash ci/coverage-manifest.sh --check

      # The manifest is a Linux artifact — cfg(unix) tests do not exist on
      # Windows, so regenerating there records their absence as coverage loss.
      # That made every test-adding PR from a non-Linux machine a two-round
      # trip: push, watch this fail, download the artifact, commit, push again.
      #
      # So this job commits the file it already computed. Adding a test cannot
      # narrow coverage, and the refresh lands as a diff in the PR like any
      # other, so the property this gate exists for — a deleted test is a
      # deleted line, visible in review — is untouched.
      #
      # The token is the App's, not `GITHUB_TOKEN`: pushes made with the latter
      # deliberately do not trigger workflows, which would leave the PR head on
      # a commit with no check runs and the required checks expected-but-never-
      # reported. The App push re-runs CI, the manifest is then current, and the
      # second run agrees and pushes nothing.
      # `secrets` is not available in a step `if`, so the App's presence is
      # read into an output first before gating the next step.
      - name: Can this run push the fix?
        id: pushable
        if: >-
          steps.manifest.outcome == 'failure'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
        run: |
          if [ -n "${APP_ID:-}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RUNNERS_APP_ID not set — leaving the corrected manifest as an artifact."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a token that can push to this PR's branch
        id: token
        if: steps.pushable.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: nixiesoftware
          repositories: lait

      - name: Refresh the coverage manifest on the branch
        id: refresh
        # A failed push must not take the job's remaining steps with it. The
        # upload below is the documented fallback for "this run cannot push" —
        # and it was unreachable, because a step that fails halts the job and
        # every later step is skipped. So the one path that hands the corrected
        # file to a human only ever ran when the push was *not attempted*
        # (a fork, or no App secret), never when it was attempted and refused.
        # The gate still fails: `Fail if the manifest was stale` is what fails
        # it, and it runs after this.
        continue-on-error: true
        if: steps.token.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # The file was computed against the merge commit, which is what this
          # gate judges everywhere — so that is what gets recorded.
          corrected="$(mktemp)"
          cp ci/coverage-manifest.txt.actual "$corrected"
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          # A loop-stop that does not depend on the push not re-triggering:
          # if the tip is already a refresh and the manifest is STILL stale,
          # something is oscillating and a human should look.
          if git log -1 --pretty=%s | grep -q '^test: refresh the coverage manifest$'; then
            echo "::error::the manifest is still stale one commit after a refresh — not looping."
            exit 1
          fi
          cp "$corrected" ci/coverage-manifest.txt
          git config user.name  "nixie-runners[bot]"
          git config user.email "nixie-runners[bot]@users.noreply.github.com"
          git add ci/coverage-manifest.txt
          git commit -m 'test: refresh the coverage manifest'
          # `actions/checkout` persists the DEFAULT token as an
          # `http.…extraheader` in `.git/config`, and that header authenticates
          # the request even when the push URL carries its own credential — so
          # this push went out as `github-actions[bot]`, which has no write
          # permission here, and was refused with a 403 while the App token sat
          # unused. Dropping the header is what lets the URL's credential be the
          # one that counts.
          #
          # Not `persist-credentials: false` on the checkout: the fetch two
          # lines up relies on those same persisted credentials, and read access
          # is all it needs.
          git config --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          echo "::notice::refreshed the coverage manifest on ${BRANCH} — pull before pushing again."

      # Fork PRs cannot be pushed to, and a run with no App secret has no token
      # to push with. Both keep the original path: hand over the file.
      - name: Upload the corrected manifest
        if: steps.manifest.outcome == 'failure' && steps.refresh.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-manifest
          path: ci/coverage-manifest.txt.actual
          if-no-files-found: ignore

      # The gate still fails the run that found it stale. The refresh above is
      # a convenience, not an amnesty: this run tested a tree whose recorded
      # coverage was wrong, and the run that matters is the one CI starts on
      # the refreshed commit.
      - name: Fail if the manifest was stale
        if: steps.manifest.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::the coverage manifest was stale for this commit."
          exit 1

  # The formats gate carried one thing the workspace suite does not: it replays
  # the committed schema examples through a NON-Rust JSON Schema 2020-12
  # validator, so the external contract is proven language-neutral rather than
  # merely serde-consistent. That is real extra coverage, so it survives the
  # collapse above as its own job.
  schema-contract:
    name: schema contract (language-neutral)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # A venv, not system pip: PEP-668 "externally-managed" images (e.g. the
      # Namespace Ubuntu 24.04 runners) refuse bare `pip install`.
      - name: Language-neutral schema validation
        run: |
          python3 -m venv .schema-venv
          .schema-venv/bin/pip install --quiet "jsonschema>=4"
          .schema-venv/bin/python ci/validate-dto-schema.py

  # Aggregate required check: green only when every PR-path job is green.
  # Branch protection points HERE, at this exact name, so a skipped or
  # cancelled job can never satisfy the release bar. The name is load-bearing
  # for that reason — renaming it silently disarms branch protection, which is
  # why it survives a restructuring that replaced most of what it used to
  # depend on.
  orbital-complete:
    name: orbital-complete
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [test, platform, viewer, signage-web, receivers, coverage-manifest, schema-contract,
            astrolabe-web, astrolabe-web-host]
    if: always()
    steps:
      - name: Assert every dependency succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | grep -q '"result": *"failure"' && exit 1
          echo "$results" | grep -q '"result": *"cancelled"' && exit 1
          echo "$results" | grep -q '"result": *"skipped"' && exit 1
          exit 0

  # Verify the MSRV floor holds. The floor is driven by typst 0.15.1 (rustc
  # 1.92), which products/issues-app pulls in; iroh 1.0.0-rc.1 held it at 1.91
  # before that. If this breaks, either the floor moved or a dep raised its MSRV.
  msrv:
    name: msrv (1.92)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # dtolnay/rust-toolchain@1.92.0 (branch head at time of pinning) — the same
      # commit publish-crates.yml pins for the MSRV floor.
      #
      # NOTE: unlike the @stable branch, the version branches declare NO `toolchain`
      # input — the branch name IS the toolchain, baked into that commit. Passing
      # `toolchain:` here is not an error, it is silently ignored with an
      # "Unexpected input(s)" warning, which is worse: the file would claim to set
      # something it does not. The comment above is what records the version.
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # rust-toolchain.toml at the repo root pins `channel = "stable"`, and rustup
      # ranks that file ABOVE the default toolchain — so without this override the
      # job would silently `cargo check` on stable, not 1.92, and the MSRV floor
      # could drift upward undetected. RUSTUP_TOOLCHAIN outranks rust-toolchain.toml,
      # forcing the 1.92.0 toolchain installed above.
      - name: Check on MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.92.0"
        run: cargo check --workspace --locked --all-targets --all-features

  # Supply-chain gate: advisories + licenses + bans + sources (deny.toml). The
  # bans list forbids the aws-lc-* backends so the portable `ring` backend can't
  # drift in transitively.
  supply-chain:
    name: cargo-deny
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Release contract: our native builders and feed publisher must retain every
  # platform the signed manifest declares. This is intentionally a repository
  # check; no third-party release planner sits between source and the feed.
  release-contract:
    name: release contract (native feed)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate scripts and declared targets
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/archive-unix.sh
          bash -n .github/scripts/archive-windows.sh
          bash -n packaging/build-astrolabe.sh
          bash -n ci/publish-feed.sh
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            grep -q "$target" .github/workflows/build-binaries.yml \
              || { echo "::error::$target missing from host builder"; exit 1; }
            grep -q "$target" .github/workflows/release.yml \
              || { echo "::error::$target missing from release completeness gate"; exit 1; }
          done
          grep -q -- '--from-run' ci/publish-feed.sh \
            || { echo "::error::feed publisher cannot consume our release run"; exit 1; }
          grep -q -- '--artifact-name' ci/publish-feed.sh \
            || { echo "::error::feed publisher cannot consume an audited SHA candidate"; exit 1; }
          grep -q -- 'candidate-provenance.env' .github/workflows/release.yml \
            || { echo "::error::candidate does not attest its exact source coordinate"; exit 1; }
          if grep -Eq '^[[:space:]]+push:' .github/workflows/release.yml; then
            echo "::error::a semantic tag must not trigger a second release build"
            exit 1
          fi
          grep -q -- '--promote' ci/publish-feed.sh \
            || { echo "::error::feed publisher cannot promote exact tested bytes"; exit 1; }
          grep -q -- '--if-generation-match=0' ci/publish-feed.sh \
            || { echo "::error::feed publisher can overwrite an immutable release"; exit 1; }
          if grep -q -- '--from-release' ci/publish-feed.sh; then
            echo "::error::feed publisher still depends on GitHub Release assets"
            exit 1
          fi
          host_distribution=(
            .github/workflows/build-binaries.yml
            .github/workflows/dev-release.yml
            .github/scripts/archive-unix.sh
            .github/scripts/archive-windows.sh
            packaging/build-astrolabe.sh
            apps/astrolabe-web/scripts/stage-sidecar.mjs
            apps/astrolabe-web/src-tauri/Cargo.toml
            apps/astrolabe-web/src-tauri/tauri.conf.json
          )
          for path in "${host_distribution[@]}"; do
            if grep -Eq 'products/(issues|signage)|lait-(issues|signage)-runner|stage-worlds\.sh|[ /]worlds([ /]|$)' "$path"; then
              echo "::error::$path still depends on, builds, or carries a World in a host release"
              exit 1
            fi
          done
          # The World half of the same contract: candidate construction in CI,
          # publication as a local, seed-holding act that verifies the exact
          # audited bytes before any channel moves.
          bash -n ci/publish-world.sh
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            grep -q "$target" .github/workflows/publish-worlds.yml \
              || { echo "::error::$target missing from World candidate builder"; exit 1; }
          done
          grep -q -- '--from-run' ci/publish-world.sh \
            || { echo "::error::World publisher cannot consume an audited candidate run"; exit 1; }
          grep -q -- '--artifact-name' ci/publish-world.sh \
            || { echo "::error::World publisher cannot name the audited SHA candidate"; exit 1; }
          grep -q -- '--signer-workflow' ci/publish-world.sh \
            || { echo "::error::World publisher does not pin the candidate workflow identity"; exit 1; }
          grep -q -- 'world-candidate-provenance.env' .github/workflows/publish-worlds.yml \
            || { echo "::error::World candidate does not record its exact source coordinate"; exit 1; }
          grep -q -- '--promote' ci/publish-world.sh \
            || { echo "::error::World publisher cannot promote exact tested bytes"; exit 1; }
          grep -q -- '--if-generation-match=0' ci/publish-world.sh \
            || { echo "::error::World publisher can overwrite an immutable release"; exit 1; }
          if grep -Eq 'WORLD_FEED_SIGNING_SEED|gcloud|google-github-actions' \
            .github/workflows/publish-worlds.yml; then
            echo "::error::the World candidate workflow can sign or move a channel; publication must stay a local act"
            exit 1
          fi
      # The Foundation is evidence, never authority, and the only file allowed
      # to know where it lives is `src/config.rs` — where the shipped default
      # is one `KeySpec` a person can overwrite or empty out. A constant or a
      # URL for it anywhere below that is a second place to rotate and a
      # substrate crate that would stop working for anyone self-hosting.
      #
      # Scoped to what is actually forbidden — a `FOUNDATION_*` identifier, or
      # a URL carrying a scheme — rather than to the word. The word appears in
      # prose that has to be able to name the service (`crates/directory`'s
      # doc comments, `crates/correspondence`'s smoke-test note) and in the
      # Host headers `crates/reach`'s tests parse, none of which reaches
      # anything at run time. Whole-line comments are dropped for the same
      # reason: a fence that fired on documentation would be turned off.
      - name: Foundation fence
        shell: bash
        run: |
          set -uo pipefail
          fence='\bFOUNDATION_[A-Z_]+\b|https?://[a-z0-9.-]*foundation\.pub'
          # The fence proves it can still fire before it reports a clean tree.
          # A pattern that quietly stopped matching would pass forever and
          # look exactly like an invariant nobody has broken.
          probe="$(mktemp -d)/probe.rs"
          printf 'const FOUNDATION_X: &str = "https://post.foundation.pub";\n' > "$probe"
          grep -qE "$fence" "$probe" \
            || { echo "::error::the Foundation fence no longer matches a planted constant"; exit 1; }
          if grep -rnE "$fence" crates/ src/daemon/ --include='*.rs' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo "::error::a Foundation constant or host is reachable below the fence (only src/config.rs may name it)"
            exit 1
          fi

  # The self-updater's in-archive binary path is a claim about our feed's
  # layout, and the unit tests can only check it against our MODEL of that
  # layout. The model was wrong twice — v0.4.8 and v0.5.0 shipped a Windows path
  # of `lait.exe.exe`, so self-update was dead on Windows for every user, and
  # nothing caught it because the test just restated the code. This job closes
  # the loop against reality: it downloads the archives users actually download
  # and asserts the path self_update would extract is really in them.
  #
  # It validates the CURRENT tree's updater against the LIVE stable release —
  # exactly the operation `Request::HostUpdate` performs.
  updater-contract:
    name: self-updater archive contract
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # This job compiles the library to run one test, so it needs the same
      # pinned toolchain and the same cache as the check matrix. Without the
      # cache it rebuilds the whole dependency graph from scratch and becomes
      # the workflow's critical path — minutes of compiling to run one
      # assertion that takes milliseconds.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Fetch the stable feed's declared host archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-archives
          base=https://storage.googleapis.com/the-foundation-dist
          curl -fsSL "$base/channels/stable" -o pointer.json
          jq -r .payload pointer.json | base64 --decode > pointer-payload.json
          manifest="$(jq -er .manifest pointer-payload.json)"
          curl -fsSL "$manifest" -o manifest.json
          jq -r .payload manifest.json | base64 --decode > manifest-payload.json
          jq -er '.artifacts.lait[].url' manifest-payload.json | while read -r url; do
            curl -fsSL "$url" -o "release-archives/${url##*/}"
          done
          ls -l release-archives
      - name: Assert the updater's path resolves inside them
        shell: bash
        env:
          LAIT_RELEASE_ARCHIVES: release-archives
        run: cargo test --lib -- --ignored --exact update::tests::update_bin_path_is_a_real_entry_in_the_published_archives

      # The other half of the contract, against the other half of the
      # distribution: resolve the LIVE first-party feed — pointer, signature
      # against the pinned key, manifest, floor — exactly as
      # `Request::HostUpdate` does on an installed machine. This couples CI to
      # the feed host being up, deliberately: a feed nobody can resolve is an
      # outage for every installed machine, and this is where it gets loud.
      - name: Assert the live feed resolves with the pinned key
        shell: bash
        run: cargo test --lib -- --ignored --exact update::feed::tests::the_real_test_channel_resolves_with_the_pinned_key
