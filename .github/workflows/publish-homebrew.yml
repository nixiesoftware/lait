# CD: push the cargo-dist-generated Homebrew formula (lait.rb, a release asset) to
# the org tap so `brew install nixiesoftware/tap/lait` picks up the release.
#
# Triggered on the **Release** workflow completing (`workflow_run`) — which fires
# even though cargo-dist creates the release with the default GITHUB_TOKEN (a
# `release:` trigger would be suppressed). By completion the release + assets
# already exist (created in the Release `host` job). `workflow_dispatch` is kept
# for manual re-runs.
#
# Auth is a short-lived token minted from the org GitHub App (integration-runners)
# scoped to just homebrew-tap — no long-lived PAT. App creds live in the repo
# secrets RUNNERS_APP_ID / RUNNERS_APP_PRIVATE_KEY; without them the job soft-skips.
name: Publish Homebrew formula

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.4.3)"
        required: true

permissions:
  contents: read

jobs:
  homebrew:
    name: push formula to tap
    # On v0.7.0 the old fleet took the Scoop, SBOM, and signature publishes and
    # never took this one; the run sat queued for the better part of an hour, so
    # the tap kept serving v0.6.3 and `brew upgrade` had nothing to find. This
    # job was moved to a GitHub-hosted runner for that reason, and moved back
    # when the fleet migrated — the queueing was a property of the old fleet, not
    # of the job.
    #
    # The reasoning survives the move, because the failure mode does: a job that
    # never starts is indistinguishable from a job with nothing to do, and
    # `timeout-minutes` cannot catch it, since queue time is not job time. If a
    # release ever ships with the tap left behind again, this is the first line
    # to change.
    runs-on: [self-hosted, lait]
    timeout-minutes: 10
    # Only a manual dispatch, or a successful Release run for a version tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    env:
      APP_ID: ${{ secrets.RUNNERS_APP_ID }}
    steps:
      - name: Resolve tag + gate on app credentials
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${RUN_TAG:-}}"
          # Fallback: the Release just created a GitHub release — use its tag.
          if [ -z "$tag" ] || [ "${tag#v}" = "$tag" ]; then
            tag="$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          [ -n "$tag" ] || { echo "::error::could not resolve a release tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "${APP_ID:-}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::RUNNERS_APP_ID not set — skipping Homebrew publish."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Mint a tap-scoped token
        id: token
        if: steps.gate.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: nixiesoftware
          repositories: homebrew-tap

      - name: Download the generated formula from the release
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'lait.rb' --output lait.rb --clobber
          test -s lait.rb

      # cargo-dist generates the formula with `url` and no `sha256` — it archives
      # in our own build job (`build-local-artifacts = false`), so it never sees
      # the bytes it is writing a formula for. Homebrew treats a missing checksum
      # as a warning, not an error, so every install so far has verified nothing
      # it downloaded. The per-archive `.sha256` sidecars are already on the
      # release; this pairs each one with its url before the formula is published.
      #
      # Fails closed: an asset with no sidecar aborts the publish rather than
      # pushing an unverifiable formula.
      - name: Pair each url with its published checksum
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sums
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern '*.tar.gz.sha256' --pattern '*.zip.sha256' --dir sums --clobber
          : > lait.rb.checked
          while IFS= read -r line; do
            printf '%s\n' "$line" >> lait.rb.checked
            case "$line" in
              *url\ \"*releases/download/*)
                asset="${line##*/}"; asset="${asset%\"}"
                sidecar="sums/$asset.sha256"
                if [ ! -f "$sidecar" ]; then
                  echo "::error::no published checksum for $asset"; exit 1
                fi
                printf '%ssha256 "%s"\n' "${line%%url*}" "$(awk '{print $1}' "$sidecar")" \
                  >> lait.rb.checked
                ;;
            esac
          done < lait.rb
          grep -q '^\s*sha256 "' lait.rb.checked || { echo "::error::no url matched"; exit 1; }
          mv lait.rb.checked lait.rb
          echo "--- formula being published ---"; cat lait.rb

      - name: Push to homebrew-tap
        if: steps.gate.outputs.ok == 'true'
        env:
          TAP_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/nixiesoftware/homebrew-tap" tap
          mkdir -p tap/Formula
          cp lait.rb tap/Formula/lait.rb
          cd tap
          git config user.name  "integration-runners[bot]"
          git config user.email "integration-runners[bot]@users.noreply.github.com"
          git add Formula/lait.rb
          if git diff --cached --quiet; then echo "formula already current"; exit 0; fi
          git commit -m "lait $TAG"
          git push
