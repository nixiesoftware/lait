name: Release Candidate

# Build one complete, native, commit-addressed candidate before a release tag
# exists. The candidate is the immutable byte set that hostile-install and
# real-data migration audits exercise. Once those exact bytes pass, tag this
# commit and publish this run's artifact; tagging never rebuilds the release.
on:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  gate:
    name: freeze candidate coordinate
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Version must be final and untagged
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::workspace version '$version' is not a final semantic version"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "::error::v$version already exists; candidates must precede the one release tag"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          short_sha="${sha:0:12}"
          artifact="candidate-$version-$short_sha"
          {
            echo "sha=$sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"

  host:
    name: native host archives
    needs: gate
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
    secrets: inherit

  astrolabe:
    name: native Astrolabe installers
    needs: gate
    uses: ./.github/workflows/build-astrolabe.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      version: ${{ needs.gate.outputs.version }}
    secrets: inherit

  sealable:
    name: assemble the feed input
    needs: [gate, host, astrolabe]
    runs-on: ubuntu-24.04
    steps:
      # The install line is generated from the archives this job assembles, by
      # the tool in this tree at the candidate's own commit — so the script a
      # release serves and the archives it pins are one byte set by
      # construction, not by two jobs agreeing.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: host-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: astrolabe-*
          path: release
          merge-multiple: true
      - name: Require every declared feed artifact and verify its checksum
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "lait-x86_64-unknown-linux-gnu.tar.gz"
            "lait-aarch64-unknown-linux-gnu.tar.gz"
            "lait-aarch64-apple-darwin.tar.gz"
            "lait-x86_64-apple-darwin.tar.gz"
            "lait-x86_64-pc-windows-msvc.zip"
            "astrolabe-$VERSION-setup.exe"
            "astrolabe-$VERSION.dmg"
            "astrolabe-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "astrolabe-tree-$VERSION-aarch64-apple-darwin.tar.gz"
            "astrolabe-tree-$VERSION-x86_64-pc-windows-msvc.tar.gz"
            "astrolabe-tree-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          )
          for file in "${required[@]}"; do
            [ -f "release/$file" ] || { echo "::error::missing $file"; exit 1; }
            [ -f "release/$file.sha256" ] || { echo "::error::missing $file.sha256"; exit 1; }
            (cd release && sha256sum -c "$file.sha256")
          done
      - name: Generate the install line for this release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p lait-feed -- installer \
            --version "$VERSION" \
            --base-url https://storage.googleapis.com/the-foundation-dist \
            --artifacts-dir release
          [ -s release/install.sh ] || { echo "::error::install.sh was not written"; exit 1; }
          (cd release && sha256sum install.sh > install.sh.sha256)
          sh -n release/install.sh

      - name: Record the immutable candidate coordinate
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'version=%s\nsource_sha=%s\n' "$VERSION" "$SOURCE_SHA" \
            > release/candidate-provenance.env
          (cd release && sha256sum candidate-provenance.env \
            > candidate-provenance.env.sha256)
      - name: Attest the candidate coordinate
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/candidate-provenance.env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.gate.outputs.artifact }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Record the audit and promotion coordinates
        env:
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ needs.gate.outputs.version }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          ARTIFACT: ${{ needs.gate.outputs.artifact }}
        run: |
          {
            echo "### Commit-addressed candidate"
            echo "Audit artifact \`$ARTIFACT\` from commit \`$SOURCE_SHA\` before creating \`v$VERSION\`."
            echo '```sh'
            echo "git tag -a v$VERSION $SOURCE_SHA"
            echo "ci/publish-feed.sh --from-run $RUN_ID --artifact-name $ARTIFACT --version $VERSION --channel test --seed ~/.lait-feed-signing.seed"
            echo "ci/publish-feed.sh --version $VERSION --channel stable --promote --seed ~/.lait-feed-signing.seed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
