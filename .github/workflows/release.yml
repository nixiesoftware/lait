name: Release

# Build one complete, native release from a version tag. The output is a
# short-lived Actions artifact; `ci/publish-feed.sh --from-run` seals and moves
# it through the signed first-party GCS channels. GitHub Releases and
# cargo-dist are not part of the distribution path.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.9.1)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  gate:
    name: verify release coordinate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag and workspace version must agree
        id: version
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$tag' is not a v-prefixed semantic version"; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [ "$tag" = "v$version" ] || {
            echo "::error::tag $tag does not match workspace version $version"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  host:
    name: native host archives
    needs: gate
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ needs.gate.outputs.tag }}
    secrets: inherit

  astrolabe:
    name: native Astrolabe installers
    needs: gate
    uses: ./.github/workflows/build-astrolabe.yml
    with:
      ref: ${{ needs.gate.outputs.tag }}
      version: ${{ needs.gate.outputs.version }}
    secrets: inherit

  sealable:
    name: assemble the feed input
    needs: [gate, host, astrolabe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: host-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: astrolabe-*
          path: release
          merge-multiple: true
      - name: Require every declared feed artifact and verify its checksum
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            lait-x86_64-unknown-linux-gnu.tar.gz
            lait-aarch64-unknown-linux-gnu.tar.gz
            lait-aarch64-apple-darwin.tar.gz
            lait-x86_64-apple-darwin.tar.gz
            lait-x86_64-pc-windows-msvc.zip
            astrolabe-$VERSION-setup.exe
            astrolabe-$VERSION.dmg
            astrolabe-$VERSION-x86_64-unknown-linux-gnu.tar.gz
            astrolabe-tree-$VERSION-aarch64-apple-darwin.tar.gz
            astrolabe-tree-$VERSION-x86_64-pc-windows-msvc.tar.gz
            astrolabe-tree-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          )
          for file in "${required[@]}"; do
            [ -f "release/$file" ] || { echo "::error::missing $file"; exit 1; }
            [ -f "release/$file.sha256" ] || { echo "::error::missing $file.sha256"; exit 1; }
            (cd release && sha256sum -c "$file.sha256")
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Record the promotion command
        env:
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          echo "### Sealed feed input" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "ci/publish-feed.sh --from-run $RUN_ID --version $VERSION --channel test --seed ~/.lait-feed-signing.seed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
