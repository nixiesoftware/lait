# Per-target build for lait's release archives. The signed first-party feed is
# the distribution contract; this workflow owns the bytes it receives:
#   - unix:    lait-<target>.tar.gz  (+ .sha256), binary + misc nested under lait-<target>/
#   - windows: lait-<target>.zip     (+ .sha256), flat: lait.exe + misc at the root
#   - Actions staging artifact: host-<target>
# The same nested-unix / flat-windows split is encoded by the self-updater.
name: Build binaries

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  # Build every target (unsigned) on PRs that touch the build path itself, so the
  # archive/contract logic is CI-tested without cutting a release. Deliberately
  # NOT triggered on Cargo.toml/lock — routine dependency bumps are already
  # covered by ci.yml, and this matrix (5 runners incl. 2× macOS) is expensive.
  pull_request:
    paths:
      - .github/workflows/build-binaries.yml
      - .github/scripts/archive-*.sh
      - .github/scripts/stage-worlds.sh
      - products/issues-runner/world.json.template
      - products/signage-runner/world.json.template
      - .github/workflows/release.yml

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  linux:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: blacksmith-4vcpu-ubuntu-2404 }
          # arm64 Linux builds natively on GitHub's hosted arm64 runner.
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # dtolnay/rust-toolchain@stable (branch head at time of pinning). The ref used
      # to select the channel, so `toolchain` is now passed explicitly — see the
      # note in publish-crates.yml.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: rel-${{ matrix.target }}
      - name: Build host and first-party World runners
        run: cargo build --release --locked --target ${{ matrix.target }} -p lait -p lait-issues-runner -p lait-signage-runner
      - name: Archive (nested tar.gz + sha256)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/archive-unix.sh "$TARGET"
      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "lait-${{ matrix.target }}.tar.gz"
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-${{ matrix.target }}
          path: |
            lait-${{ matrix.target }}.tar.gz
            lait-${{ matrix.target }}.tar.gz.sha256

  macos:
    name: build ${{ matrix.target }}
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # dtolnay/rust-toolchain@stable (branch head at time of pinning). The ref used
      # to select the channel, so `toolchain` is now passed explicitly — see the
      # note in publish-crates.yml.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: rel-${{ matrix.target }}
      - name: Build host and first-party World runners
        run: cargo build --release --locked --target ${{ matrix.target }} -p lait -p lait-issues-runner -p lait-signage-runner
      # SIGNING SLOT (next increment): codesign --options runtime the binary here,
      # then notarize + staple a .pkg, before the archive step. Secret-gated.
      - name: Archive (nested tar.gz + sha256)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/archive-unix.sh "$TARGET"
      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "lait-${{ matrix.target }}.tar.gz"
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-${{ matrix.target }}
          path: |
            lait-${{ matrix.target }}.tar.gz
            lait-${{ matrix.target }}.tar.gz.sha256

  windows:
    name: build x86_64-pc-windows-msvc
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # dtolnay/rust-toolchain@stable (branch head at time of pinning). The ref used
      # to select the channel, so `toolchain` is now passed explicitly.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: rel-x86_64-pc-windows-msvc
      - name: Build host and first-party World runners
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p lait -p lait-issues-runner -p lait-signage-runner
      # SIGNING SLOT (next increment): Azure-sign target\...\lait.exe here, before
      # the zip step. Secret-gated.
      - name: Archive (flat zip + sha256)
        shell: bash
        run: bash .github/scripts/archive-windows.sh "$TARGET"
      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "lait-x86_64-pc-windows-msvc.zip"
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-x86_64-pc-windows-msvc
          path: |
            lait-x86_64-pc-windows-msvc.zip
            lait-x86_64-pc-windows-msvc.zip.sha256
