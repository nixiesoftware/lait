# An always-on lait seed node: a headless peer that stays reachable to bootstrap
# and backfill encrypted space history for other nodes (A§10). It is NOT a
# trust authority — genesis + the signed ACL still gate every op — so a seed only
# holds ciphertext until an admin admits it to the space.
#
# Quick start:
#   docker compose up -d --build
#
# The container runs `lait daemon` — headless, and deliberately so: lait has no
# command surface, so there is nothing to type at inside it. Binding this node to
# a space is a one-time act performed through a head, and a head binds LOOPBACK
# ONLY, so one started inside the container is unreachable from the host. Give
# the node a bind-mounted home and bootstrap it from the host instead:
#
#   # docker-compose.override.yml:  services: { seed: { volumes: ["./seed-home:/data"] } }
#   docker compose stop seed              # the store takes one writer
#   LAIT_HOME=./seed-home lait --open     # Welcome → "Use an invite", paste the link
#   docker compose start seed
#
# Then share this seed in your invite tickets so cold clients backfill from it.
# Admitting the seed to the space happens from the inviter's own app.
#
# iroh handles NAT traversal via relays, so no inbound port is strictly required.
# Publishing a stable UDP port (below) lets peers form direct connections faster.

services:
  seed:
    build: .
    # Built locally from ./Dockerfile (see `build:` above) and tagged with this
    # name. No image is published to GHCR yet, so use `--build` on first bring-up
    # (`docker compose up -d --build`); a bare `docker compose pull` won't find it
    # until a container-publish channel is enabled.
    image: ghcr.io/nixiesoftware/lait:latest
    container_name: lait-seed
    restart: unless-stopped
    # Persist the node identity + content-addressed store across restarts.
    volumes:
      - lait-seed-data:/data
    # Optional: expose a stable UDP port for faster direct (non-relayed) dials.
    # ports:
    #   - "11204:11204/udp"
    stop_grace_period: 10s

volumes:
  lait-seed-data:
