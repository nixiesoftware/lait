    <title>lait × astryx — theme spike</title>

  <body>
    <!-- Spike only: `?light` forces the light branch before first paint, so we
         are testing the palette rather than Chrome's re-invalidation of
         light-dark() inside a var() chain when color-scheme changes live. -->
    <script>
      if (location.search.includes("light")) document.documentElement.dataset.theme = "light";
    </script>
    <div id="root"></div>
    <script type="module" src="/src/theme/proof.tsx"></script>
  </body>
