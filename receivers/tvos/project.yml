name: AstrolabeReceiver
options:
  bundleIdPrefix: com.nixiesoftware
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AstrolabeReceiver:
    type: application
    platform: tvOS
    sources:
      - AstrolabeReceiver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixiesoftware.astrolabe
        PRODUCT_NAME: Astrolabe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Astrolabe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationRequiresPersistentWiFi: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Astrolabe connects to the display coordinator you approve on your local network.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  AstrolabeReceiverTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: AstrolabeReceiverTests
        excludes:
          - Fixtures
      - path: AstrolabeReceiverTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: AstrolabeReceiver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixiesoftware.astrolabe.tests
        GENERATE_INFOPLIST_FILE: YES
