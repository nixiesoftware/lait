[package]
name = "astrolabe-display-reference"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Executable reference receiver for Astrolabe Display"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
display-protocol = { path = "../../crates/display-protocol" }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
mechanics = { path = "../../crates/mechanics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints]
workspace = true
