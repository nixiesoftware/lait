plugins {
    id "com.android.application"
}

android {
    namespace "com.nixiesoftware.astrolabe"
    compileSdk 35

    defaultConfig {
        applicationId "com.nixiesoftware.astrolabe"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def syncDisplayRuntime = tasks.register("syncDisplayRuntime", Copy) {
    from("../../shared/web") {
        include "*.mjs"
    }
    into("src/main/assets/runtime")
}

tasks.named("preBuild").configure {
    dependsOn(syncDisplayRuntime)
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
