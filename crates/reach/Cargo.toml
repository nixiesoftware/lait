[package]
name = "lait-reach"
version = "0.7.8"
edition = "2021"
rust-version = "1.92"
description = "The reach router: bridges Web-PKI receivers to identity coordinators over the display overlay."
license = "PolyForm-Noncommercial-1.0.0"
# Not published, for the same reason the crates it sits on are not: this is one
# of lait's internal boundaries made runnable, not a library surface.
publish = false

[lints]
workspace = true

[[bin]]
name = "lait-reach"
path = "src/main.rs"

[dependencies]
comms = { path = "../comms" }
mechanics = { path = "../mechanics" }

anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
tower = "0.5"
