[package]
name = "world-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
anyhow = "1"
data-encoding = "2.6"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The native serve loop mints a runner credential and subscribes stderr; a wasm
# guest has neither a listener to protect nor a process whose logs escape, so
# both stay off the browser target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
