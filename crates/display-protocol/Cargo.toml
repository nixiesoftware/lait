[package]
name = "display-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Bounded receiver protocol for Astrolabe Display"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
data-encoding = "2.6"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
