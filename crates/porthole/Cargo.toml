# porthole — the lait engine, packaged to run one World in a browser tab.
#
# A person opens an invite link in a tab on a device with no daemon, and reaches
# a Space through this: the daemon's own engine (`runtime::browser::Station`, the
# Contact pull, the World runner over the 4-fn ABI) stood up behind one
# `#[wasm_bindgen]` `boot()` and driven by the shipped viewer's Worker. It is
# world-agnostic by construction — the World identity and mount are inputs, never
# literals — and it is the shippable heir of the `wasm-probe` engine modules,
# which `wasm-probe` now re-exports so its browser claims keep testing this code.
#
# Its own workspace root, not merely excluded — exactly as `wasm-probe`/`sim`:
# it needs getrandom's JS backend and the rustc cfg in `.cargo/config.toml`,
# which a repo-root build must never see, and an empty `[workspace]` table stops
# cargo adopting it into an outer workspace (a git worktree under the repo).
#
#   wasm-pack build --target web crates/porthole   # the shippable module
#
# `ring` (via `comms`) needs a clang with a wasm32 backend (Apple clang cannot);
# set CC_wasm32_unknown_unknown / AR_wasm32_unknown_unknown to an llvm clang.
[workspace]

[package]
name = "porthole"
version = "0.0.0"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
edition = "2021"
rust-version = "1.92"

[features]
# The R1 snapshot round-trip proof (`verify_snapshot_roundtrip`), exported to
# JS. OFF by default, because it is a claim about the engine and not a thing the
# product does: it captures the whole Space and restores a SECOND copy in
# memory, so on a real Space calling it costs ~2x the Space in a tab's heap.
# The harness that drives the proof builds with it; the shipped module does not
# carry it. `capture`/`snapshot` — the real durability path — stay ungated.
proof = []

[lib]
# `cdylib` is what wasm-pack links into the shippable module; `rlib` lets
# `wasm-probe` depend on this crate and re-export its modules for the browser
# tests, so one body of code is both shipped and verified.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine closure — what `wasm-probe`'s `probe-dispatch` feature pulled, now
# the product's own non-optional dependency set.
mechanics = { path = "../mechanics" }
world-runner = { path = "../world-runner" }
anyhow = "1"
journal = { path = "../journal", features = ["opfs"] }
fabric = { path = "../fabric" }
replica = { path = "../replica" }
comms = { path = "../comms", default-features = false }
contact = { path = "../contact", features = ["wire"] }
blake3 = "1"
web-time = "1"
n0-future = "0.3"
runtime = { path = "../runtime" }
world-sdk = { path = "../world-sdk" }
world-interface = { path = "../world-interface" }
browser-control = { path = "../browser-control" }
futures-lite = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# The entropy door, opened toward JS. Three getrandom generations live in the
# graph; listing 0.2 (js) and 0.3 (wasm_js) here turns the switch for the whole
# graph through feature unification. The `getrandom_backend="wasm_js"` cfg in
# `.cargo/config.toml` arms 0.3/0.4. This crate never calls getrandom itself.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

postcard = { version = "1", features = ["use-std"] }
wasm-bindgen = "0.2"
# Async `#[wasm_bindgen]` exports (boot, repull, publishCaret) compile to JS
# Promises through this glue.
wasm-bindgen-futures = "0.4"
