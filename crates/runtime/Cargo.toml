[package]
name = "runtime"
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
description = "LAIT orbital lifecycle: Runtime, Orbit, Station, World hosting, Dock/Session, Contact policy, and Observation publication. Exposes no CRDT, iroh, stream, file, key, ciphertext, mutex, or product request types."
license = "MIT OR Apache-2.0"
# Not published. These are lait's internal boundaries, not a library surface —
# the descriptions above say so ("the ONLY crate that names loro", "the ONLY
# crate that names iroh"), and those are architecture invariants rather than a
# contract for strangers to build on. crates.io has no private tier and no
# delete: publishing would claim the name permanently and make the API a public
# semver commitment. `crates/journal` already carried this flag; the rest now
# agree with it.
publish = false

[dependencies]
# mechanics — Space/Actor/Device/Station identity and authority facts.
mechanics = { path = "../mechanics" }
# replica — Body semantics, schemas, descriptors, frontiers, Convergence.
replica = { path = "../replica" }
fabric = { path = "../fabric" }
# comms — gossip, presence dial, framed streams, ALPN adapters. Runtime drives
# the transport seam; `iroh` is absent from this manifest by construction.
comms = { path = "../comms" }
journal = { path = "../journal" }

serde = { version = "1", features = ["derive"] }
# `[u8; 64]` signature fields: serde only derives arrays up to length 32.
serde-byte-array = "0.1"
# Canonical wire encoding for the signed World-action envelope (and later public
# envelopes). postcard is the workspace-pinned canonical codec.
postcard = { version = "1", features = ["use-std"] }
# base32 for the Coordinates v1 link form.
data-encoding = "2.6"
# Payload commitment in the World-action header.
blake3 = "1"
# The external DTO surface (S7): versioned JSON, strict unknown-field
# rejection.
serde_json = "1"
# JSON Schema 2020-12 generation for the committed external DTO contract.
schemars = "1"
# NFC validation of the human-facing display-name/nick hints in Coordinates v1
# (the canonical form rejects non-NFC UTF-8).
unicode-normalization = "0.1"
# Cross-platform advisory file lock: the Orbit's exclusive store lock (the typed
# double-lock). Same lock the product's single-instance daemon guard uses.
fs2 = "0.4"
# The Station's Contact plane: one tracked driver thread runs a current-thread
# tokio runtime to drive the comms transport (accept loop, scheduler, gossip).
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# Minting a fresh SpaceId digest at formation.
getrandom = "0.3"
anyhow = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[dev-dependencies]
regex = "1.13.1"
# The Contact wire decoders run BEFORE a signature is checked — they have to,
# because the signature is inside the thing being decoded — so the parser is
# the outermost attack surface here. `contact_frame_fuzz` generates malformed
# input structurally rather than waiting for a peer to send some.
proptest = "1"
# `comms::Connection` is an `#[async_trait]`, so a test stub of it needs the
# same macro. Only a stub needs one — production code holds `Box<dyn Connection>`
# and never implements the trait.
async-trait = "0.1"
# The real-iroh Contact gate test builds two loopback endpoints on a
# multi-thread runtime that outlives the Stations driving them.
# `test-util` is what makes the clock seam real: with it, `tokio::time::pause()`
# freezes `tokio::time::Instant::now()` for every call site at once, so a test
# can advance a sweep interval or a probation window without waiting for one.
#
# Declared here even though it is ALREADY ON: `n0-future`, which iroh depends
# on, enables `tokio/test-util` unconditionally, so every build of this
# workspace — release included — already has it. Naming it in dev-dependencies
# is belt-and-braces, so the seam does not silently stop working if iroh's
# dependency tree changes under us. If it ever did, `tokio::time::pause` would
# cease to exist and the time-driven tests would fail to COMPILE, which is the
# right way for this to break.
#
# What that costs in release: `tokio::time::Instant::now()` is an `Acquire` load
# of a "has anyone paused?" flag followed by `std::time::Instant::now()`, rather
# than the bare call. That was already true of the `tokio::time::Instant` sites
# in src/app.rs, src/cli.rs and src/daemon/host.rs; this makes it true of the
# runtime drivers too. Next to the network I/O these loops are doing, it does
# not register.
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "test-util"] }
