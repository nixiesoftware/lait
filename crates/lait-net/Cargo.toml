[package]
name = "lait-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A thin runnable front over `netstack`: bring up lait's L3 tunnel on a device. Linux-first."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lints]
workspace = true

[[bin]]
name = "lait-net"
path = "src/main.rs"

[dependencies]
# The boundary this binary fronts. It names no transport type of its own —
# netstack owns the addressing, the TUN seam, and the carry; this parses args
# and calls it, exactly as `lait-relay` fronts `comms::relay`.
netstack = { path = "../netstack" }
# Identity: turn a seed into a device, and a peer's public key into its id.
mechanics = { path = "../mechanics" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
