[package]
name = "journal"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Semantics-free crash-safe object/manifest journal: immutable content-addressed objects, atomic manifest swap, fsync/directory-sync discipline, fault injection, and recovery. Knows nothing about Bodies, authority, or any product."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[features]
fault-injection = []
# The browser medium: OPFS sync access handles in a dedicated worker, behind
# a sahpool-style physical-file pool. wasm32-only by construction — the deps
# it turns on are target-gated below and never reach a native build.
opfs = [
    "dep:js-sys",
    "dep:send_wrapper",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
data-encoding = "2.6"
# Pack-slot salts: 16 random bytes per slot creation, so a stale seal from a
# prior slot life can never verify against the new one.
getrandom = "0.3"
# The pack table published to readers: every commit snapshots it, so clones
# must share structure rather than copy the map.
imbl = "7.0.1"
tracing = "0.1"

# The store-owner lock and the migration space preflight are native facts:
# flock/statvfs on unix, LockFileEx/GetDiskFreeSpaceExW on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The OPFS medium's bindings, behind the `opfs` feature. `send_wrapper` is
# how the JS handle types satisfy the seam's Send + Sync bounds honestly: a
# panic on cross-thread use instead of an unsafe claim — the pattern iroh's
# own wasm support uses via n0-future.
[target.'cfg(all(target_arch = "wasm32", not(target_feature = "atomics")))'.dependencies]
js-sys = { version = "0.3", optional = true }
send_wrapper = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[lints]
workspace = true

[dev-dependencies]
