[package]
name = "world-bridge"
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
description = "Product-neutral application calls into LAIT Worlds"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
replica = { path = "../replica" }
runtime = { path = "../runtime" }

serde = { version = "1", features = ["derive"] }
data-encoding = "2.6"

[dev-dependencies]
serde_json = "1"
