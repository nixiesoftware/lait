[package]
name = "mechanics"
version = "0.7.8"
edition = "2021"
rust-version = "1.92"
description = "The lait kernel: identity, trust regimes, and derivation rules — the roots lait grows from, depending on no scaffold (no CRDT engine, no transport)."
license = "MIT OR Apache-2.0"
# Not published. These are lait's internal boundaries, not a library surface —
# the descriptions above say so ("the ONLY crate that names loro", "the ONLY
# crate that names iroh"), and those are architecture invariants rather than a
# contract for strangers to build on. crates.io has no private tier and no
# delete: publishing would claim the name permanently and make the API a public
# semver commitment. `crates/journal` already carried this flag; the rest now
# agree with it.
publish = false

[features]
fault-injection = ["journal/fault-injection"]

# Nothing from a scaffold may be named here. This crate lists neither loro nor
# iroh in its manifest, so a CRDT or transport reference cannot compile — the
# boundary is the dependency edge, enforced by rustc, not by review.
# (This note used to hang off an empty `[lints.rust]` table, which a manifest
# inheriting the workspace lints may not also carry.)
[dependencies]
# The semantics-free crash-safe object/manifest journal the authority ledger
# commits through (the same machinery Fabric's Body store uses).
journal = { path = "../journal" }
# identity + signatures
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
sha2 = "0.10"
blake3 = "1"
# RFC 9180 HPKE, for the context-bound sealed box. Chosen over the hand-rolled
# construction it replaced for the parts that are easy to get wrong and give no
# sign when they are: rejecting a non-contributory agreement (§7.1.4), labeled
# key schedule derivation, and a defined place to bind context (`info`). The
# 0.13 line is deliberate — it resolves onto the RustCrypto generation this
# crate already runs (x25519-dalek 2, chacha20poly1305 0.10, sha2 0.10) and adds
# no second copy of the crypto stack. 0.14 moves to the next generation and is
# the follow-on once this crate does, which is also where its ML-KEM hybrid
# lives.
# Default features drag in the NIST curve stack (p256/elliptic-curve/sec1);
# only the X25519 suite is used.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
# hpke takes its CSPRNG from rand_core 0.9; frost-ed25519 takes its from 0.6,
# and the two majors do not unify. Both are already in the tree, so this names
# the second rather than adding one.
rand_core_hpke = { package = "rand_core", version = "0.9", features = ["os_rng"] }
# Password-based key derivation for the passphrase unlock slot on a portable
# share package. Memory-hard by design: blake3's derive_key is a KDF, not a
# PASSWORD KDF, and using it here would make an offline guessing attack cheap.
# Pure Rust (RustCrypto), consistent with the no-C-toolchain rule.
argon2 = "0.5"
# threshold recovery ceremony (dealer-free DKG + signing)
frost-ed25519 = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.3"
# serialization of signed bytes + wire/DTO types
serde = { version = "1", features = ["derive"] }
# JSON Schema for the authority DTOs a product publishes in its policy bundle
# (products/issues' product_policy_schema_bundle, gated by its drift test).
schemars = "1"
postcard = { version = "1", features = ["use-std"] }
data-encoding = "2.6"
anyhow = "1"
# Ceremony-engine diagnostics (per-transcript fault isolation logs).
tracing = "0.1"

[lints]
workspace = true

# `secretfs`: custody secret material (FROST shares, signing nonces, recovery
# keys) is created with an explicit owner-only DACL and optional DPAPI wrap on
# Windows; std exposes neither, so the secret paths call
# CreateFileW/CreateDirectoryW directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
# dto's serialization doctests/round-trips only.
serde_json = "1"
journal = { path = "../journal", features = ["fault-injection"] }
