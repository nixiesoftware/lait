[package]
name = "fabric"
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
description = "The lait fabric: the shared world — documents, persistence, history, convergence, and projection, with the Loro scaffold sealed behind typed wrappers. The ONLY crate that names loro."
license = "MIT OR Apache-2.0"
# Not published. These are lait's internal boundaries, not a library surface —
# the descriptions above say so ("the ONLY crate that names loro", "the ONLY
# crate that names iroh"), and those are architecture invariants rather than a
# contract for strangers to build on. crates.io has no private tier and no
# delete: publishing would claim the name permanently and make the API a public
# semver commitment. `crates/journal` already carried this flag; the rest now
# agree with it.
publish = false

[dependencies]
# lait's roots — the fabric wraps the scaffold in lait's own types.
mechanics = { path = "../mechanics" }
# The semantics-free crash-safe object/manifest journal (re-exported as
# `fabric::journal`). Extracted so mechanics can commit its authority ledger
# through the same durability machinery without depending on Fabric.
journal = { path = "../journal" }
# The convergence scaffold. This is the only crate in this Cargo workspace that
# lists it, so `loro::*` is nameable here and nowhere else — the seal is the
# manifest.
loro = "=1.13.6"
# durable persistence + signed-op encoding
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
data-encoding = "2.6"
anyhow = "1"
getrandom = "0.3"

[dev-dependencies]
# a membership test constructs a raw signing key to forge an op author.
ed25519-dalek = "2"
