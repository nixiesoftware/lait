[package]
name = "contact"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Contact v2 — the bounded direct material exchange (`lait/contact/2`): the signed Hello/Ack, the twelve-frame grammar, the pure transport-free transcript machines, and the initiator that drives them over a comms stream. Extracted from the runtime so a browser peer and the daemon speak from ONE set of types; the scheduler, registry, and accept side remain the runtime's."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[features]
# The `pull` initiator drives a comms stream, which pulls iroh. Only a peer
# that actually pulls a Space needs it (the browser engine); the types — the
# grammar, the transcript machines, the coordinates — are transport-free and
# always present. A World runner links contact for those types and must not
# drag iroh into its wasm, so `wire` is off by default and the engine turns
# it on.
default = []
wire = ["dep:comms"]

[dependencies]
mechanics = { path = "../mechanics" }
replica = { path = "../replica" }
journal = { path = "../journal" }
# The transport seam the initiator drives; wasm-clean end to end. Optional,
# behind `wire`.
comms = { path = "../comms", optional = true }

anyhow = "1"
blake3 = "1"
# Ticket rendering: base32 link form, NFC-stable display names.
data-encoding = "2.6"
unicode-normalization = "0.1"
getrandom = "0.3"
# The initiator's two-deadline discipline needs a clock that exists on every
# target; n0-future's is web-time-backed in a browser.
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde-byte-array = "0.1"
tracing = "0.1"

[lints]
workspace = true
