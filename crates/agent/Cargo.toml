[package]
name = "agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Provider-neutral identity, ownership, and inventory domain for first-class Lait agents."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lints]
workspace = true

[dependencies]
mechanics = { path = "../mechanics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-byte-array = "0.1"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
