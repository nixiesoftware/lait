[package]
name = "world-interface"
version = "0.7.8"
edition = "2021"
rust-version = "1.92"
description = "Composable client interfaces for LAIT World applications"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
replica = { path = "../replica" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
schemars = "1"

[lints]
workspace = true
